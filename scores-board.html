<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kava &amp; Co. Trivia — Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg:#07141a; --panel:#0f2830; --panel-2:#143540; --line:#1f4a52;
    --ink:#f5f5f5; --muted:#7fa8b0;
    --aqua:#45DBE0; --aqua-bright:#7fe9ed; --lagoon:#2ba6ab; --cream:#FFF3E0;
    --gold:#FFCF3A;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 0%, #0d3038 0%, var(--bg) 70%);
    color:var(--ink); font-family:"Helvetica Neue","Segoe UI",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; height:100vh; padding:4vh 4vw; }

  /* ---------- Leaderboard ---------- */
  .title { text-align:center; flex:0 0 auto; margin-bottom:3vh; }
  .title .logo { font-family:"Bungee",sans-serif; font-size:5vh; color:var(--aqua); letter-spacing:.2vh; }
  .title .sub { font-size:2.2vh; color:var(--muted); text-transform:uppercase; letter-spacing:.5vh; margin-top:.6vh; }
  .board { flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:1.4vh; max-width:1100px; width:100%; margin:0 auto; }
  .row {
    display:flex; align-items:center; gap:2vw; height:9vh; padding:0 2.5vw;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:2px solid var(--line); border-radius:1.6vh;
    transition: border-color .3s;
  }
  .row.leader { border-color:var(--aqua); box-shadow:0 0 3.5vh rgba(69,219,224,.35); }
  .rank { font-family:"Bungee",sans-serif; font-size:4.6vh; color:var(--aqua-bright); width:8vh; text-align:center; flex:0 0 auto; }
  .row.leader .rank { color:var(--gold); }
  .swatch { width:3vh; height:3vh; border-radius:50%; flex:0 0 auto; border:.3vh solid rgba(255,255,255,.3); }
  .name { flex:1 1 auto; font-size:4vh; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score { font-family:"Bungee",sans-serif; font-size:4.6vh; color:var(--cream); flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .row.leader .score { color:var(--gold); }
  .crown { font-size:3.4vh; margin-left:1vh; }

  /* ---------- Wheel ---------- */
  .wheel-wrap { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; }
  .wheel-holder { position:relative; width:min(76vh, 90vw); aspect-ratio:1; }
  .pointer {
    position:absolute; top:-1vh; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:2.4vh solid transparent; border-right:2.4vh solid transparent;
    border-top:4.4vh solid var(--aqua); z-index:5; filter:drop-shadow(0 .4vh .6vh rgba(0,0,0,.7));
  }
  svg#tvwheel {
    width:100%; height:100%; display:block; border-radius:50%;
    box-shadow:0 0 0 .9vh #000, 0 0 0 1.4vh var(--aqua), 0 3vh 7vh rgba(0,0,0,.6);
    transition: transform 5s cubic-bezier(.17,.67,.28,1);
  }
  .hub { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:7vh; height:7vh; border-radius:50%; background:var(--aqua); border:.6vh solid #000; z-index:4; }
  .winner-banner {
    font-family:"Bungee",sans-serif; font-size:5vh; color:var(--gold); min-height:6vh;
    text-align:center; text-shadow:0 0 3vh rgba(255,207,58,.5);
    opacity:0; transition:opacity .4s;
  }
  .winner-banner.show { opacity:1; }

  .empty { margin:auto; text-align:center; color:var(--muted); }
  .empty .logo { font-family:"Bungee",sans-serif; font-size:7vh; color:var(--aqua); }
  .empty .msg { font-size:3vh; margin-top:2vh; }

  /* ---------- Music round: "Song N" card ---------- */
  .song-wrap { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.6vh; text-align:center; }
  .song-kicker { font-family:"Bungee",sans-serif; font-size:4vh; color:var(--aqua); letter-spacing:1.2vh; text-shadow:0 0 2.5vh rgba(69,219,224,.45); }
  .song-label { font-family:"Bungee",sans-serif; font-size:9vh; color:var(--cream); letter-spacing:1vh; line-height:1; }
  .song-num {
    font-family:"Bungee",sans-serif; font-size:34vh; line-height:.9; color:var(--gold);
    text-shadow:0 0 5vh rgba(255,207,58,.55), 0 0 1.2vh rgba(255,207,58,.8);
  }
  .song-num.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  .song-dots { display:flex; gap:1.6vh; margin-top:1vh; }
  .song-dots span { width:2.4vh; height:2.4vh; border-radius:50%; border:.35vh solid var(--lagoon); }
  .song-dots span.done { background:var(--lagoon); }
  .song-dots span.now { background:var(--gold); border-color:var(--gold); box-shadow:0 0 2vh rgba(255,207,58,.6); }
  .eq { display:flex; align-items:flex-end; gap:1vh; height:7vh; }
  .eq i { display:block; width:1.6vh; height:100%; background:var(--aqua); border-radius:.6vh; transform-origin:bottom; animation: eq 1s ease-in-out infinite; opacity:.85; }
  .eq i:nth-child(2){ animation-delay:-.6s; } .eq i:nth-child(3){ animation-delay:-.2s; }
  .eq i:nth-child(4){ animation-delay:-.8s; } .eq i:nth-child(5){ animation-delay:-.4s; }
  @keyframes eq { 0%,100% { transform:scaleY(.25); } 50% { transform:scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .eq i, .song-num.pop { animation:none; } .eq i { transform:scaleY(.6); } }

  /* ---------- QR card ---------- */
  .qr-view { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4vh; text-align:center; }
  .qr-view .qr-label { font-family:"Bungee",sans-serif; font-size:6vh; color:var(--aqua); text-shadow:0 0 3vh rgba(69,219,224,.45); line-height:1.1; max-width:90vw; }
  .qr-view .qr-box { background:#fff; border-radius:2.4vh; padding:2.4vh; width:52vh; height:52vh; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 .8vh var(--aqua), 0 3vh 7vh rgba(0,0,0,.6); }
  .qr-view .qr-box img, .qr-view .qr-box canvas { width:100% !important; height:100% !important; display:block; }
  .qr-view .qr-url { font-size:2.6vh; color:var(--muted); letter-spacing:.1vh; word-break:break-all; max-width:80vw; }

  /* ---------- Feud board (same look as feud-screen.html, scoped to #feudView) ---------- */
  #feudView {
    --fbg:#07101f; --fpanel:#0f2246; --fline:#1e3a6b; --fmuted:#9fb2d4;
    --blue:#2f6bff; --blue-bright:#4d8bff; --blue-deep:#12245a;
    --orange:#FF7A45; --orange-bright:#ff9560; --orange-deep:#c9531f; --fred:#b5484e;
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; padding:3vh 3vw;
    background:radial-gradient(circle at 50% 0%, #123a7a 0%, var(--fbg) 70%);
  }
  #feudView .idle { margin:auto; text-align:center; }
  #feudView .idle .logo { font-family:"Bungee",sans-serif; font-size:9vh; color:var(--blue-bright); line-height:1.05; }
  #feudView .idle .logo .co { color:var(--cream); display:block; font-size:6vh; }
  #feudView .idle .tag { margin-top:3vh; font-size:2.4vh; color:var(--fmuted); text-transform:uppercase; letter-spacing:.4vh; }
  #feudView .idle .qr-wrap { background:#fff; border-radius:2vh; padding:2vh; width:34vh; height:34vh; margin:4vh auto 0; display:flex; align-items:center; justify-content:center; box-shadow:0 2vh 5vh rgba(0,0,0,.5); }
  #feudView .idle .qr-wrap img, #feudView .idle .qr-wrap canvas { width:100% !important; height:100% !important; display:block; }
  #feudView .idle .scan-cta { margin-top:2.4vh; font-size:3.4vh; font-weight:800; color:var(--orange); }
  #feudView .idle .scan-sub { margin-top:1vh; font-size:2vh; color:var(--fmuted); }
  #feudView .fheader { text-align:center; flex:0 0 auto; margin-bottom:2vh; }
  #feudView .kicker { font-family:"Bungee",sans-serif; color:var(--orange); font-size:2.4vh; letter-spacing:.4vh; }
  #feudView .question { font-size:4vh; font-weight:800; margin-top:1vh; line-height:1.15; }
  #feudView .fboard { flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:1.4vh; max-width:1100px; width:100%; margin:0 auto; }
  #feudView .slot { display:flex; align-items:center; height:8.5vh; border-radius:1.4vh; overflow:hidden; position:relative; transition:background .35s ease, border-color .35s ease, box-shadow .35s ease; }
  #feudView .slot:not(.covered) { background:linear-gradient(180deg,var(--orange),var(--orange-deep)); border:2px solid var(--orange-bright); box-shadow:0 0 3.5vh rgba(255,122,69,.45); }
  #feudView .slot .num { flex:0 0 auto; width:8.5vh; height:100%; display:flex; align-items:center; justify-content:center; font-family:"Bungee",sans-serif; font-size:4vh; color:#fff; background:linear-gradient(180deg,var(--orange-deep),#a8410f); }
  #feudView .slot.covered { justify-content:center; background:linear-gradient(180deg,var(--fpanel),var(--blue-deep)); border:2px solid var(--fline); }
  #feudView .slot.covered .content, #feudView .slot.covered .num { display:none; }
  #feudView .slot.covered .num-chip { font-family:"Bungee",sans-serif; font-size:4.4vh; color:var(--blue-bright); width:6vh; height:6vh; border-radius:50%; border:.4vh solid var(--blue-bright); display:flex; align-items:center; justify-content:center; box-shadow:0 0 3vh rgba(77,139,255,.5); }
  #feudView .slot:not(.covered) .num-chip { display:none; }
  #feudView .slot .content { flex:1 1 auto; display:flex; align-items:center; justify-content:space-between; padding:0 3vh; }
  #feudView .slot .answer { font-size:3.6vh; font-weight:800; text-transform:uppercase; letter-spacing:.1vh; color:#fff; }
  #feudView .slot .count { font-family:"Bungee",sans-serif; font-size:3.6vh; color:#fff; min-width:8vh; height:5.6vh; padding:0 2vh; border-radius:1vh; background:rgba(0,0,0,.28); display:flex; align-items:center; justify-content:center; }
  #feudView .slot.reveal-anim { animation:fpop .4s cubic-bezier(.2,1.3,.4,1); }
  @keyframes fpop { 0%{transform:scale(.9);opacity:.4;} 100%{transform:scale(1);opacity:1;} }
  #feudView .teams-strip { flex:0 0 auto; display:flex; justify-content:center; margin-top:2.5vh; }
  #feudView .active-team { background:linear-gradient(180deg,var(--fpanel),var(--blue-deep)); border:2px solid var(--blue-bright); border-radius:1.6vh; padding:1.8vh 5vw; min-width:40vw; display:flex; align-items:center; justify-content:center; gap:2vw; box-shadow:0 0 3.5vh rgba(77,139,255,.4); }
  #feudView .ts-name { font-size:3.6vh; font-weight:800; color:var(--fmuted); text-transform:uppercase; letter-spacing:.2vh; }
  #feudView .ts-xs { display:flex; gap:1.4vh; }
  #feudView .team-x { font-family:"Bungee",sans-serif; font-size:4.4vh; color:var(--fred); opacity:.15; transition:opacity .2s, text-shadow .2s; }
  #feudView .team-x.on { opacity:1; color:#ff3b3b; text-shadow:0 0 2vh rgba(255,59,59,.8); }
  #feudView .offline-note { margin:auto; color:var(--fmuted); font-size:3vh; text-align:center; }
  #bigX { position:fixed; inset:0; margin:auto; width:40vh; height:40vh; display:flex; align-items:center; justify-content:center;
    font-family:"Bungee",sans-serif; font-size:34vh; color:#ff2b2b; text-shadow:0 0 6vh rgba(255,43,43,.9);
    opacity:0; pointer-events:none; z-index:40; transform:scale(.4); }
  #bigX.show { animation:xflash 1s ease-out; }
  @keyframes xflash { 0%{opacity:0;transform:scale(.4);} 15%{opacity:1;transform:scale(1.1);} 40%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1);} }
  #muteBtn { position:fixed; top:1.5vh; left:2vw; z-index:45; background:#0f2246; color:var(--ink); border:1px solid #1e3a6b; border-radius:999px; padding:1vh 2vh; font-size:1.8vh; font-weight:700; cursor:pointer; }

  .live-dot { position:fixed; top:1.5vh; right:2vw; width:1.2vh; height:1.2vh; border-radius:50%; background:var(--aqua); opacity:.5; transition:opacity .3s; }
  .live-dot.ping { opacity:1; }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div class="live-dot" id="dot"></div>

  <!-- LEADERBOARD VIEW -->
  <div id="leaderboardView">
    <div id="lbRoot">
      <div class="empty"><div class="logo">Kava &amp; Co.</div><div class="msg">Standings will appear here</div></div>
    </div>
  </div>

  <!-- WHEEL VIEW -->
  <div id="wheelView" class="wheel-wrap hidden">
    <div class="wheel-holder">
      <div class="pointer"></div>
      <svg id="tvwheel" viewBox="0 0 400 400" role="img" aria-label="Team spinner"></svg>
      <div class="hub"></div>
    </div>
    <div class="winner-banner" id="winnerBanner"></div>
  </div>

  <!-- MUSIC ROUND VIEW -->
  <div id="songView" class="song-wrap hidden">
    <div class="song-kicker">Music Round</div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="song-label">Song</div>
    <div class="song-num" id="songNum">1</div>
    <div class="song-dots" id="songDots"></div>
  </div>

  <!-- QR CARD VIEW -->
  <div id="qrView" class="qr-view hidden">
    <div class="qr-label" id="qrLabel"></div>
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-url" id="qrUrl"></div>
  </div>

  <!-- FEUD VIEW -->
  <div id="feudView" class="hidden">
    <button id="muteBtn" onclick="toggleMute()">&#128266; Sound on</button>
    <div id="feudRoot"></div>
  </div>
  <div id="bigX">&#10007;</div>

<script>
const API = "/.netlify/functions/scores";
const R = 200, CX = 200, CY = 200;
const dot = document.getElementById("dot");
const lbRoot = document.getElementById("lbRoot");
const leaderboardView = document.getElementById("leaderboardView");
const wheelView = document.getElementById("wheelView");
const tvwheel = document.getElementById("tvwheel");
const winnerBanner = document.getElementById("winnerBanner");

let lastLbSig = "";
let lastWheelSig = "";
let lastSpinToken = null;
let tvRotation = 0;
let currentDisplay = "leaderboard";
let latestTeams = [];

function pulse(){ dot.classList.add("ping"); setTimeout(()=>dot.classList.remove("ping"),300); }
function escapeHtml(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}
function polar(cx,cy,r,angle){const a=(angle-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function pickTextColor(hex){const c=(hex||"#45DBE0").replace("#","");const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*0.299+g*0.587+b*0.114)>150?"#000":"#fff";}

/* ---------- Draw the wheel from a given team order ---------- */
function drawTVWheel(activeTeams){
  const n = activeTeams.length;
  tvwheel.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg";
  if (n === 0) {
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",CX);c.setAttribute("cy",CY);c.setAttribute("r",R);c.setAttribute("fill","#143540");
    tvwheel.appendChild(c); return;
  }
  if (n === 1) {
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",CX);c.setAttribute("cy",CY);c.setAttribute("r",R);
    c.setAttribute("fill",activeTeams[0].color);c.setAttribute("stroke","#000");c.setAttribute("stroke-width","1.5");
    tvwheel.appendChild(c);
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",CX);t.setAttribute("y",CY);t.setAttribute("fill",pickTextColor(activeTeams[0].color));
    t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");
    t.setAttribute("font-size","18");t.setAttribute("font-weight","700");
    t.textContent=activeTeams[0].name||"Team"; tvwheel.appendChild(t); return;
  }
  const arc = 360/n;
  activeTeams.forEach((team,i)=>{
    const start=i*arc, end=start+arc;
    const [x1,y1]=polar(CX,CY,R,start), [x2,y2]=polar(CX,CY,R,end);
    const large = arc>180?1:0, mid=start+arc/2;
    const path=document.createElementNS(NS,"path");
    path.setAttribute("d",`M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z`);
    path.setAttribute("fill",team.color);path.setAttribute("stroke","#000");path.setAttribute("stroke-width","1.5");
    tvwheel.appendChild(path);
    if (team.name){
      const [tx,ty]=polar(CX,CY,R*0.64,mid);
      const text=document.createElementNS(NS,"text");
      text.setAttribute("x",tx);text.setAttribute("y",ty);
      text.setAttribute("fill",pickTextColor(team.color));
      text.setAttribute("text-anchor","middle");text.setAttribute("dominant-baseline","middle");
      text.setAttribute("font-size",n>12?"11":"15");text.setAttribute("font-weight","700");
      text.setAttribute("transform",`rotate(${mid} ${tx} ${ty})`);
      let lbl=team.name; if(lbl.length>16)lbl=lbl.slice(0,15)+"\u2026";
      text.textContent=lbl; tvwheel.appendChild(text);
    }
  });
}

/* ---------- Animate a spin to the winner ---------- */
function runSpin(order, winnerId, turns){
  // order = array of team ids currently on the wheel (matches host)
  const activeTeams = order.map(id => latestTeams.find(t => t.id === id)).filter(Boolean);
  if (!activeTeams.length) return;
  drawTVWheel(activeTeams);

  const n = activeTeams.length;
  const arc = 360/n;
  const winnerIdx = activeTeams.findIndex(t => t.id === winnerId);
  if (winnerIdx < 0) return;
  const winnerCenter = winnerIdx*arc + arc/2;
  const target = turns*360 + (360 - winnerCenter);

  // reset transition then animate
  winnerBanner.classList.remove("show");
  tvwheel.style.transition = "none";
  tvwheel.style.transform = `rotate(${tvRotation % 360}deg)`;
  // force reflow so the reset takes effect before the animated transform
  void tvwheel.offsetWidth;
  tvwheel.style.transition = "transform 5s cubic-bezier(.17,.67,.28,1)";
  tvRotation = target;
  tvwheel.style.transform = `rotate(${tvRotation}deg)`;

  const winner = activeTeams[winnerIdx];
  setTimeout(() => {
    winnerBanner.textContent = (winner.name || "Team") + "!";
    winnerBanner.classList.add("show");
  }, 5100);
}

/* ---------- Leaderboard render ---------- */
function renderLeaderboard(teams){
  const shown = teams.filter(t => (t.name && t.name.trim()) || t.score);
  if (!shown.length) {
    if (lastLbSig === "empty") return;
    lastLbSig = "empty";
    lbRoot.innerHTML = `<div class="empty"><div class="logo">Kava &amp; Co.</div><div class="msg">Standings will appear here</div></div>`;
    return;
  }
  const ranked = shown.slice().sort((a,b)=>b.score-a.score);
  const maxScore = Math.max(...ranked.map(t=>t.score),0);
  const sig = JSON.stringify(ranked.map(t=>[t.name,t.score,t.color]));
  if (sig === lastLbSig) return;
  lastLbSig = sig;

  let lastScore=null,lastRank=0;
  const rows = ranked.map((t,i)=>{
    const rank=(t.score===lastScore)?lastRank:i+1; lastScore=t.score; lastRank=rank;
    const leader = t.score===maxScore && maxScore>0;
    return `<div class="row ${leader?"leader":""}">
      <div class="rank">${rank}</div>
      <div class="swatch" style="background:${escapeHtml(t.color||"#45DBE0")}"></div>
      <div class="name">${escapeHtml(t.name||"Team")}${leader?'<span class="crown">\u{1F451}</span>':''}</div>
      <div class="score">${(t.score||0).toLocaleString()}</div>
    </div>`;
  }).join("");
  lbRoot.innerHTML = `
    <div class="title"><div class="logo">Standings</div><div class="sub">Kava &amp; Company Trivia</div></div>
    <div class="board">${rows}</div>`;
}

const songView = document.getElementById("songView");
let lastSongSig = "";
function renderSong(song){
  const n = (song && song.n) || 1, total = (song && song.total) || 0;
  const sig = n + "/" + total;
  if (sig === lastSongSig) return;
  lastSongSig = sig;
  const num = document.getElementById("songNum");
  num.textContent = n;
  num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
  let dots = "";
  for (let i = 1; i <= total; i++) dots += `<span class="${i < n ? "done" : i === n ? "now" : ""}"></span>`;
  document.getElementById("songDots").innerHTML = dots;
}

function showView(display){
  if (display === currentDisplay) return;
  currentDisplay = display;
  wheelView.classList.toggle("hidden", display !== "wheel");
  leaderboardView.classList.toggle("hidden", display !== "leaderboard");
  songView.classList.toggle("hidden", display !== "song");
  qrView.classList.toggle("hidden", display !== "qr");
  feudView.classList.toggle("hidden", display !== "feud");
  lastSongSig = ""; lastQrSig = ""; lastFeudSig = ""; lastStrikeEvent = null; prevRevealed = {};
  // force re-render of whichever is now visible
  lastLbSig = ""; lastWheelSig = "";
}

let spinEndsAt = 0;

async function tick(){
  let data;
  try { const res = await fetch(API + "?action=status",{cache:"no-store"}); data = await res.json(); pulse(); }
  catch(e){ return; }

  latestTeams = (data.teams||[]).map(t => ({ id:t.id, name:t.name, score:t.score, color:t.color, out:!!t.out }));

  // spin command? run it once per new token (also flips view to wheel)
  if (data.spin && data.spin.token && data.spin.token !== lastSpinToken) {
    lastSpinToken = data.spin.token;
    showView("wheel");
    spinEndsAt = Date.now() + 5200;
    runSpin(data.spin.order || [], data.spin.winnerId, data.spin.turns || 6);
  }

  // display switch from host
  showView(["wheel", "song", "qr", "feud"].includes(data.display) ? data.display : "leaderboard");
  if (data.links && data.links.feud) feudBase = data.links.feud.replace(/\/+$/, "");

  if (currentDisplay === "leaderboard") {
    renderLeaderboard(latestTeams);
  } else if (currentDisplay === "song") {
    renderSong(data.song);
  } else if (currentDisplay === "qr") {
    renderQrCard(data.qr);
  } else if (currentDisplay === "feud") {
    await feudTick();
  } else {
    // keep the wheel drawn with current teams when idle (never mid-spin)
    const active = latestTeams.filter(t => !t.out);
    const sig = JSON.stringify(active.map(t=>[t.id,t.name,t.color]));
    if (sig !== lastWheelSig && Date.now() > spinEndsAt) {
      lastWheelSig = sig;
      drawTVWheel(active);
    }
  }
}

/* ---------- QR card ---------- */
const qrView = document.getElementById("qrView");
let lastQrSig = "";
function drawQR(box, url, size){
  box.innerHTML = "";
  if (typeof QRCode === "undefined") { box.textContent = url; return; }
  new QRCode(box, { text: url, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
}
function renderQrCard(qr){
  const sig = qr ? qr.url + "|" + qr.label : "none";
  if (sig === lastQrSig) return;
  lastQrSig = sig;
  document.getElementById("qrLabel").textContent = (qr && qr.label) || "Scan me";
  document.getElementById("qrUrl").textContent = qr ? qr.url.replace(/^https?:\/\//, "") : "";
  if (qr && qr.url) drawQR(document.getElementById("qrBox"), qr.url, 480);
}

/* ---------- Feud board (reads the Feud site's backend) ---------- */
const feudView = document.getElementById("feudView");
const feudRoot = document.getElementById("feudRoot");
let feudBase = "https://kavafeud.netlify.app";
let lastFeudSig = "";
let prevRevealed = {};
let lastStrikeEvent = null;
let muted = false;
let audioCtx = null;

function buzzer(){
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18].forEach((offset) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + offset); osc.stop(now + offset + 0.16);
    });
  } catch(e) {}
}
function flashBigX(){
  const el = document.getElementById("bigX");
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
window.toggleMute = function(){
  muted = !muted;
  document.getElementById("muteBtn").innerHTML = muted ? "&#128263; Muted" : "&#128266; Sound on";
  // tapping also unlocks audio on browsers that need a click first
  if (!muted) { try { audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state==="suspended") audioCtx.resume(); } catch(e){} }
};

async function feudTick(){
  const FAPI = feudBase + "/.netlify/functions/feud";
  let s;
  try { const res = await fetch(FAPI + "?action=status&view=screen", { cache:"no-store" }); s = await res.json(); }
  catch(e) {
    if (lastFeudSig !== "offline") { lastFeudSig = "offline"; feudRoot.innerHTML = `<div class="offline-note">Connecting to the Feud board&hellip;</div>`; }
    return;
  }
  // buzzer + big X when a new strike lands (ignore the count we found on arrival)
  if (typeof s.strikeEvent === "number") {
    if (lastStrikeEvent === null) lastStrikeEvent = s.strikeEvent;
    else if (s.strikeEvent > lastStrikeEvent) { lastStrikeEvent = s.strikeEvent; buzzer(); flashBigX(); }
  }

  if (!s.board || !s.board.slots || !s.board.slots.length) {
    // No board loaded: show the survey QR if a survey is live, else a "get ready" screen
    let phone = null;
    try { const pr = await fetch(FAPI + "?action=status&view=phone", { cache:"no-store" }); phone = await pr.json(); } catch(e) {}
    const live = phone && phone.surveyId;
    const sig = "idle:" + (live ? phone.surveyId + phone.title : "none") + feudBase;
    if (sig === lastFeudSig) return;
    lastFeudSig = sig; prevRevealed = {};
    if (live) {
      feudRoot.innerHTML = `<div class="idle">
          <div class="logo">Kava &amp;<span class="co">Company</span></div>
          <div class="scan-cta">&#128241; Scan to take the survey</div>
          <div class="qr-wrap" id="feudQr"></div>
          <div class="scan-sub">${escapeHtml(phone.title || "")} — answer on your phone!</div>
        </div>`;
      drawQR(document.getElementById("feudQr"), feudBase + "/feud-survey.html", 300);
    } else {
      feudRoot.innerHTML = `<div class="idle"><div class="logo">Kava &amp;<span class="co">Company</span></div><div class="tag">Feud — get ready to play</div></div>`;
    }
    return;
  }

  const strikes = s.strikes || 0;
  const sig = JSON.stringify({ q: s.question, slots: s.board.slots.map(x => [x.text, x.count, x.revealed]), strikes });
  if (sig === lastFeudSig) return;
  lastFeudSig = sig;
  const slotsHtml = s.board.slots.map((sl, i) => `
    <div class="slot ${sl.revealed ? "" : "covered"}" data-i="${i}">
      <div class="num-chip">${i+1}</div>
      <div class="num">${i+1}</div>
      <div class="content"><span class="answer">${escapeHtml(sl.text)}</span><span class="count">${sl.count}</span></div>
    </div>`).join("");
  const xs = [1,2,3].map(n => `<span class="team-x ${n <= strikes ? "on":""}">\u2715</span>`).join("");
  feudRoot.innerHTML = `
    <div class="fheader"><div class="kicker">Survey Says&hellip;</div><div class="question">${escapeHtml(s.question || "")}</div></div>
    <div class="fboard">${slotsHtml}</div>
    <div class="teams-strip"><div class="active-team"><div class="ts-name">Strikes</div><div class="ts-xs">${xs}</div></div></div>`;
  s.board.slots.forEach((sl, i) => {
    if (sl.revealed && !prevRevealed[i]) { const el = feudRoot.querySelector(`.slot[data-i="${i}"]`); if (el) el.classList.add("reveal-anim"); }
    prevRevealed[i] = sl.revealed;
  });
}
// feudRoot needs flex layout to fill the screen like feud-screen's body
feudRoot.style.cssText = "flex:1 1 auto; display:flex; flex-direction:column; min-height:0;";

tick();
setInterval(tick, 1200);
</script>
</body>
