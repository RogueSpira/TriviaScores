<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kava &amp; Co. Trivia — Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Shrikhand&family=Fredoka:wght@500;600;700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Mandarin "tropical escape" look: jungle green + sunset orange, black pop-art outlines.
     Type per the brand guide: Shrikhand for big moments, Fredoka for names/scores, DM Sans for small text. */
  :root {
    --jungle:#0e2c18; --jungle-2:#163f23; --leaf:#5f951f; --neon:#34E209; --lime:#C0FF5B;
    --orange:#F36F03; --orange-2:#ff8a2a; --sun:#F0BF17; --cream:#FFF3E0; --ink:#0b0800;
    --muted:#cfe2c4;
    --groovy:"Shrikhand","Georgia",serif;
    --round:"Fredoka","Segoe UI",system-ui,sans-serif;
    --body:"DM Sans","Segoe UI",system-ui,sans-serif;
    /* names the Feud view and older bits still use */
    --gold:#F0BF17; --aqua:#F36F03;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; color:var(--cream); font-family:var(--body); }
  html { background:var(--jungle); }
  body {
    display:flex; flex-direction:column; height:100vh; padding:3.5vh 4vw;
    background:
      radial-gradient(ellipse 75% 70% at 50% 45%, rgba(14,44,24,.74) 0%, rgba(10,32,17,.86) 65%, rgba(6,22,11,.94) 100%),
      url("assets/mandarin-pattern.jpg") center / cover no-repeat;
  }
  body.title-mode {
    background:
      radial-gradient(ellipse 70% 60% at 50% 50%, rgba(14,44,24,.35) 0%, rgba(9,30,16,.6) 80%),
      url("assets/mandarin-pattern.jpg") center / cover no-repeat;
  }
  .groovy { font-family:var(--groovy); font-weight:400; }
  .retro { color:var(--cream); -webkit-text-stroke:.3vh var(--ink); paint-order:stroke fill; text-shadow:.55vh .55vh 0 var(--orange); }

  /* ---------- Leaderboard ---------- */
  .lb-head { display:flex; flex-direction:column; align-items:center; flex:0 0 auto; margin-bottom:2.6vh; gap:.4vh; }
  .lb-logo { height:12vh; width:auto; filter:drop-shadow(0 .8vh 1.6vh rgba(0,0,0,.45)); }
  .lb-title { font-family:var(--groovy); font-size:5.6vh; line-height:1.1; }
  .board { flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:1.5vh; max-width:1100px; width:100%; margin:0 auto; perspective:120vh; }
  .row {
    display:flex; align-items:center; gap:2vw; height:8.6vh; padding:0 2.4vw 0 1.4vw;
    background:var(--cream); color:var(--ink);
    border:.45vh solid var(--ink); border-radius:1.8vh;
    box-shadow:.7vh .7vh 0 var(--ink);
    transition: transform .3s ease;
  }
  .row.leader { background:var(--sun); }
  .rank {
    width:6.6vh; height:6.6vh; flex:0 0 auto; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--orange); color:var(--cream); border:.4vh solid var(--ink);
    font-family:var(--round); font-weight:700; font-size:3.6vh;
  }
  .row.leader .rank { background:var(--leaf); }
  .swatch { width:2.8vh; height:2.8vh; border-radius:50%; flex:0 0 auto; border:.35vh solid var(--ink); }
  .name { flex:1 1 auto; font-family:var(--round); font-size:4vh; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score { font-family:var(--round); font-weight:700; font-size:4.6vh; color:#2c6b0e; flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .row.leader .score { color:var(--ink); }
  .crown { font-size:3.4vh; margin-left:1vh; }

  /* reveal mode: rows stay face-down until the host reveals them, lowest place first */
  .row.face-down { background:var(--jungle-2); color:var(--cream); border-style:dashed; border-color:var(--cream); box-shadow:none; }
  .row.face-down .rank { background:transparent; border-color:var(--cream); }
  .row.face-down .name { font-family:var(--groovy); font-weight:400; letter-spacing:1vh; opacity:.75; }
  .row.flip { animation: flipin .7s cubic-bezier(.2,1.2,.4,1); transform-origin:center; }
  @keyframes flipin { 0% { transform:rotateX(90deg); } 100% { transform:rotateX(0); } }
  .row.champ { animation: flipin .9s cubic-bezier(.2,1.2,.4,1), champglow 1.6s ease-in-out .9s infinite alternate; }
  @keyframes champglow { from { box-shadow:.7vh .7vh 0 var(--ink), 0 0 0 rgba(240,191,23,0); } to { box-shadow:.7vh .7vh 0 var(--ink), 0 0 6vh rgba(240,191,23,.9); } }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:30; }

  /* ---------- Wheel ---------- */
  .wheel-wrap { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; }
  .wheel-holder { position:relative; width:min(76vh, 90vw); aspect-ratio:1; }
  .pointer {
    position:absolute; top:-1.2vh; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:2.6vh solid transparent; border-right:2.6vh solid transparent;
    border-top:4.8vh solid var(--orange); z-index:5; filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(.4vh .4vh 0 var(--ink));
  }
  svg#tvwheel {
    width:100%; height:100%; display:block; border-radius:50%;
    box-shadow:0 0 0 .9vh var(--ink), 0 0 0 1.8vh var(--orange), 0 0 0 2.3vh var(--ink), 0 3vh 7vh rgba(0,0,0,.6);
    transition: transform 5s cubic-bezier(.17,.67,.28,1);
  }
  .hub { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:7vh; height:7vh; border-radius:50%; background:var(--sun); border:.6vh solid var(--ink); z-index:4; }
  .winner-banner { font-family:var(--groovy); font-size:6vh; min-height:7vh; text-align:center; opacity:0; transition:opacity .4s; }
  .winner-banner.show { opacity:1; }

  .empty { margin:auto; text-align:center; color:var(--muted); }
  .empty img { width:min(70vw, 100vh); height:auto; filter:drop-shadow(0 1vh 2vh rgba(0,0,0,.5)); }
  .empty .msg { font-family:var(--round); font-size:3vh; margin-top:3vh; }

  /* ---------- Music round: "Song N" card ---------- */
  .song-wrap { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2vh; text-align:center; }
  .song-kicker { font-family:var(--round); font-weight:700; font-size:3.6vh; color:var(--lime); letter-spacing:1vh; text-transform:uppercase; }
  .song-label { font-family:var(--groovy); font-size:10vh; line-height:1; }
  .song-num {
    font-family:var(--groovy); font-size:32vh; line-height:.95; color:var(--orange);
    -webkit-text-stroke:.6vh var(--ink); paint-order:stroke fill;
    text-shadow:1.2vh 1.2vh 0 var(--sun), 1.8vh 1.8vh 0 var(--ink);
  }
  .song-num.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  .song-dots { display:flex; gap:1.6vh; margin-top:1.4vh; }
  .song-dots span { width:2.6vh; height:2.6vh; border-radius:50%; border:.4vh solid var(--ink); background:var(--cream); }
  .song-dots span.done { background:var(--leaf); }
  .song-dots span.now { background:var(--orange); transform:scale(1.25); }
  .eq { display:flex; align-items:flex-end; gap:1vh; height:6vh; }
  .eq i { display:block; width:1.6vh; height:100%; background:var(--lime); border:.3vh solid var(--ink); border-radius:.6vh; transform-origin:bottom; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:-.6s; background:var(--orange); } .eq i:nth-child(3){ animation-delay:-.2s; background:var(--sun); }
  .eq i:nth-child(4){ animation-delay:-.8s; background:var(--orange); } .eq i:nth-child(5){ animation-delay:-.4s; }
  @keyframes eq { 0%,100% { transform:scaleY(.25); } 50% { transform:scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .eq i, .song-num.pop, .row.flip, .row.champ { animation:none; } .eq i { transform:scaleY(.6); } }

  /* ---------- QR card ---------- */
  .qr-view { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.6vh; text-align:center; }
  .qr-view .qr-label { font-family:var(--groovy); font-size:6.4vh; line-height:1.15; max-width:90vw; }
  .qr-view .qr-box { background:#fff; border-radius:2.4vh; padding:2.4vh; width:52vh; height:52vh; display:flex; align-items:center; justify-content:center; border:.6vh solid var(--ink); box-shadow:1.2vh 1.2vh 0 var(--orange), 1.8vh 1.8vh 0 var(--ink); }
  .qr-view .qr-box img, .qr-view .qr-box canvas { width:100% !important; height:100% !important; display:block; }
  .qr-view .qr-url { font-family:var(--round); font-size:2.6vh; color:var(--muted); word-break:break-all; max-width:80vw; }

  /* ---------- Jeopardy ---------- */
  .jp-view { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  #jpRoot { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  .jb-top { display:flex; align-items:center; justify-content:center; gap:2vw; margin-bottom:1.6vh; flex:0 0 auto; }
  .jb-top img { height:7vh; filter:drop-shadow(0 .5vh 1vh rgba(0,0,0,.45)); }
  .jb-top .jb-name { font-family:var(--groovy); font-size:4.4vh; }
  .jb-grid { flex:1 1 auto; display:grid; grid-template-columns:repeat(5, 1fr); grid-template-rows:1.25fr repeat(5, 1fr); gap:1vh; min-height:0; }
  .jb-t { border:.4vh solid var(--ink); border-radius:1.4vh; box-shadow:.5vh .5vh 0 var(--ink); display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; min-height:0; }
  .jb-head { background:var(--cream); color:var(--ink); font-family:var(--round); font-weight:700; font-size:2.7vh; line-height:1.15; padding:0 1vh; text-transform:uppercase; word-break:break-word; }
  .jb-head.closed { background:var(--jungle-2); }
  .jb-head.closed img { width:80%; height:auto; opacity:.95; }
  .jb-head.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .jb-val { background:var(--jungle-2); font-family:var(--groovy); font-size:6.6vh; color:var(--orange); -webkit-text-stroke:.3vh var(--ink); paint-order:stroke fill; text-shadow:.5vh .5vh 0 var(--sun); }
  .jb-val.used { background:rgba(0,0,0,.28); border-style:dashed; border-color:rgba(255,243,224,.25); box-shadow:none; color:transparent; -webkit-text-stroke:0; text-shadow:none; }
  .jb-gamble { flex:1 1 auto; display:grid; grid-template-columns:repeat(3, 1fr); gap:3vw; padding:2vh 4vw 6vh; min-height:0; }
  .jb-gamble .jb-t { flex-direction:column; gap:2vh; padding:3vh 2vw; }
  .jb-gamble .jb-head { font-family:var(--groovy); text-transform:none; font-size:6vh; font-weight:400; color:var(--ink); }
  .jb-gamble .jb-head .n { font-family:var(--round); font-weight:700; font-size:2.6vh; letter-spacing:.3vh; text-transform:uppercase; color:var(--orange); }
  .jb-gamble .jb-head.closed img { width:85%; }
  .jb-gamble .jb-head.used { background:rgba(0,0,0,.28); border-style:dashed; border-color:rgba(255,243,224,.25); box-shadow:none; color:rgba(255,243,224,.35); }
  .jb-gamble .jb-head.used .n { color:rgba(255,243,224,.35); }
  .jb-sub { text-align:center; font-family:var(--round); font-weight:700; font-size:3vh; color:var(--cream); letter-spacing:.3vh; text-transform:uppercase; margin-top:-.6vh; margin-bottom:1vh; }
  .jq-wager { font-family:var(--groovy); font-size:11vh; line-height:1.05; color:var(--orange); -webkit-text-stroke:.35vh var(--ink); paint-order:stroke fill; text-shadow:.7vh .7vh 0 var(--sun); }
  .jq-wager-sub { font-family:var(--round); font-weight:700; font-size:3.4vh; letter-spacing:.3vh; text-transform:uppercase; }
  .jq-anshead { background:var(--leaf); color:var(--cream); border-bottom:.5vh solid var(--ink); text-align:center; padding:.8vh; font-family:var(--round); font-weight:700; font-size:2.8vh; letter-spacing:.4vh; text-transform:uppercase; }
  .jq-buzz { display:flex; align-items:center; justify-content:center; gap:2vw; padding:1.2vh 3vw; border-bottom:.5vh solid var(--ink); font-family:var(--round); font-weight:700; font-size:4.6vh; color:var(--cream); background:var(--jungle-2); text-transform:uppercase; letter-spacing:.2vh; }
  .jq-buzz i { width:4.4vh; height:4.4vh; border-radius:50%; border:.45vh solid var(--ink); flex:0 0 auto; }
  .jq-buzz small { font-size:2.8vh; letter-spacing:.3vh; opacity:.9; }
  .jq-bzt, .fb-bzt { font-family:var(--groovy); font-size:5vh; min-width:12vh; text-align:center; padding:0 1.6vh; border-radius:1.6vh; background:var(--cream); color:var(--ink); border:.4vh solid var(--ink); text-transform:none; letter-spacing:0; line-height:1.25; }
  .jq-bzt:empty, .fb-bzt:empty { display:none; }
  .jq-bzt.low, .fb-bzt.low { background:var(--sun); } .jq-bzt.done, .fb-bzt.done { background:#e5241b; color:var(--cream); }
  .jq-bzt.paused, .fb-bzt.paused { opacity:.6; }
  .fb-bzt { font-size:3.8vh; min-width:9vh; }
  .jq-buzz.hit { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .jq-buzz.open { background:var(--leaf); font-size:3.4vh; animation: bzglow 1.1s ease-in-out infinite; }
  @keyframes bzglow { 50% { filter:brightness(1.25); } }
  #feudBuzz { position:fixed; top:2.4vh; left:50%; transform:translateX(-50%); z-index:60; display:flex; align-items:center; gap:1.6vw; padding:1.4vh 3vw; border-radius:999px;
    background:var(--cream); color:var(--ink); border:.5vh solid var(--ink); box-shadow:.8vh .8vh 0 var(--orange), 1.2vh 1.2vh 0 var(--ink); font-family:var(--round); font-weight:700; font-size:4vh; text-transform:uppercase; }
  #feudBuzz i { width:3.6vh; height:3.6vh; border-radius:50%; border:.4vh solid var(--ink); }
  #feudBuzz.open { background:var(--leaf); color:var(--cream); font-size:3vh; }
  #feudBuzz.hit { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .qr-view .qr-teams { display:flex; flex-wrap:wrap; justify-content:center; gap:1.2vh 1.2vw; max-width:86vw; }
  .qr-view .qr-teams span { display:inline-flex; align-items:center; gap:.8vw; background:var(--cream); color:var(--ink); border:.35vh solid var(--ink); border-radius:999px; padding:.6vh 1.6vw; font-family:var(--round); font-weight:700; font-size:2.8vh; animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .qr-view .qr-teams i { width:2.2vh; height:2.2vh; border-radius:50%; border:.3vh solid var(--ink); }
  .jq-card { flex:1 1 auto; display:flex; flex-direction:column; background:var(--cream); color:var(--ink); border:.6vh solid var(--ink); border-radius:3vh; box-shadow:1.2vh 1.2vh 0 var(--orange), 1.8vh 1.8vh 0 var(--ink); overflow:hidden; min-height:0; margin:0 2vw 2vh; }
  .jq-meta { background:var(--orange); color:var(--cream); border-bottom:.5vh solid var(--ink); display:flex; justify-content:space-between; align-items:center; padding:1.4vh 3vw; font-family:var(--round); font-weight:700; font-size:3.4vh; text-transform:uppercase; letter-spacing:.2vh; }
  .jq-meta .v { font-family:var(--groovy); text-transform:none; font-size:4.4vh; -webkit-text-stroke:.25vh var(--ink); paint-order:stroke fill; }
  .jq-body { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4vh; padding:2.4vh 4vw; min-height:0; text-align:center; }
  .jq-text { font-family:var(--round); font-weight:600; font-size:6.4vh; line-height:1.18; }
  .jq-body.has-media .jq-text { font-size:4.2vh; }
  .jq-media { flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .jq-media img, .jq-media video { max-width:100%; max-height:100%; border:.5vh solid var(--ink); border-radius:1.6vh; background:#000; object-fit:contain; }
  .jq-media .yt { width:min(100%, calc((100vh - 46vh) * 16 / 9)); aspect-ratio:16/9; max-height:100%; border:.5vh solid var(--ink); border-radius:1.6vh; overflow:hidden; background:#000; }
  .jq-media .yt iframe, .jq-media .yt > div { width:100%; height:100%; display:block; border:0; }
  .jq-media.audio-only .yt, .jq-media.audio-only audio { position:absolute; width:2px; height:2px; opacity:0; pointer-events:none; }
  .jq-audio { display:flex; align-items:flex-end; gap:1.4vh; height:16vh; }
  .jq-audio i { display:block; width:2.6vh; height:100%; border:.4vh solid var(--ink); border-radius:.8vh; background:var(--orange); transform-origin:bottom; transform:scaleY(.3); }
  .jq-audio.on i { animation: eq 1s ease-in-out infinite; }
  .jq-audio i:nth-child(2){ background:var(--sun); animation-delay:-.6s; } .jq-audio i:nth-child(3){ background:var(--leaf); animation-delay:-.2s; }
  .jq-audio i:nth-child(4){ background:var(--sun); animation-delay:-.8s; } .jq-audio i:nth-child(5){ animation-delay:-.4s; }
  .jq-ans { background:var(--leaf); color:var(--cream); border-top:.5vh solid var(--ink); padding:1.8vh 3vw; text-align:center; font-family:var(--groovy); font-size:5.4vh; -webkit-text-stroke:.25vh var(--ink); paint-order:stroke fill; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .jq-ans small { font-family:var(--round); font-weight:700; font-size:2.6vh; -webkit-text-stroke:0; display:block; opacity:.9; letter-spacing:.3vh; text-transform:uppercase; }
  .jq-timer { display:flex; align-items:center; gap:2vw; padding:1.4vh 3vw; border-top:.5vh solid var(--ink); background:var(--jungle-2); }
  .jq-timer .bar { flex:1 1 auto; height:2.4vh; border:.35vh solid var(--ink); border-radius:2vh; background:var(--cream); overflow:hidden; }
  .jq-timer .fill { height:100%; background:var(--orange); transform-origin:left; }
  .jq-timer .num { font-family:var(--groovy); font-size:5vh; color:var(--cream); min-width:9vh; text-align:right; -webkit-text-stroke:.25vh var(--ink); paint-order:stroke fill; }
  .jq-timer.out .num { color:#e5241b; }
  #soundChip { position:fixed; top:1.5vh; left:50%; transform:translateX(-50%); z-index:50; background:var(--cream); color:var(--ink); border:.35vh solid var(--ink); border-radius:999px; padding:1vh 2.4vh; font-family:var(--round); font-weight:700; font-size:2.2vh; box-shadow:.5vh .5vh 0 var(--orange); cursor:pointer; }

  /* ---------- Manny, hiding in the corner ---------- */
  #manny {
    position:fixed; right:2.6vw; bottom:-12vh; height:24vh; width:auto; z-index:12; pointer-events:none;
    transform:rotate(-7deg); transform-origin:50% 100%;
    filter:drop-shadow(0 .6vh 1vh rgba(0,0,0,.45));
    animation: mannypeek 48s ease-in-out infinite;
  }
  /* mostly tucked below the edge; every so often he pops up and wiggles, then ducks back down */
  /* --mrest / --mpeak: how far he hides and pops up (lower on the Jeopardy board so he doesn't cover a tile) */
  body { --mrest:-12vh; --mpeak:-1vh; }
  body.jp-mode { --mrest:-19vh; --mpeak:-11vh; }
  body.jp-mode #jpRoot { padding-bottom:3vh; }
  #manny { bottom:var(--mrest); }
  @keyframes mannypeek {
    0%, 86%, 100% { bottom:var(--mrest); transform:rotate(-7deg); }
    89% { bottom:var(--mpeak); transform:rotate(-7deg); }
    91% { transform:rotate(6deg); } 93% { transform:rotate(-8deg); } 95% { bottom:var(--mpeak); transform:rotate(4deg); }
    98% { bottom:var(--mrest); transform:rotate(-7deg); }
  }
  /* 1st place revealed: Manny jumps up, bounces and spins, then ducks back into his corner */
  #manny.party { animation: mannyparty 6.5s cubic-bezier(.3,.7,.4,1) 1; }
  @keyframes mannyparty {
    0%   { bottom:-12vh; transform:rotate(-7deg) scale(1); }
    10%  { bottom:30vh;  transform:rotate(8deg) scale(1.35); }
    18%  { bottom:6vh;   transform:rotate(-6deg) scale(1.3, 1.22); }
    26%  { bottom:26vh;  transform:rotate(180deg) scale(1.3); }
    34%  { bottom:6vh;   transform:rotate(360deg) scale(1.3, 1.22); }
    42%  { bottom:20vh;  transform:rotate(368deg) scale(1.3); }
    50%  { bottom:6vh;   transform:rotate(352deg) scale(1.3); }
    56%  { transform:rotate(372deg) scale(1.3); } 62% { transform:rotate(348deg) scale(1.3); }
    68%  { transform:rotate(372deg) scale(1.3); } 74% { bottom:6vh; transform:rotate(355deg) scale(1.3); }
    90%  { bottom:6vh;   transform:rotate(353deg) scale(1.3); }
    100% { bottom:-12vh; transform:rotate(353deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { #manny { animation:none; } #manny.party { animation:none; bottom:4vh; } }

  /* ---------- Feud board — Mandarin branding (scoped to #feudView) ---------- */
  #feudView {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; padding:3vh 3vw;
    background:
      radial-gradient(ellipse 75% 70% at 50% 45%, rgba(14,44,24,.74) 0%, rgba(10,32,17,.86) 65%, rgba(6,22,11,.94) 100%),
      url("assets/mandarin-pattern.jpg") center / cover no-repeat;
    background-color:var(--jungle);
  }
  #feudView .idle { margin:auto; text-align:center; display:flex; flex-direction:column; align-items:center; }

  #feudView .fboard { flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:1.5vh; max-width:1100px; width:100%; margin:0 auto; perspective:120vh; }
  #feudView .slot {
    display:flex; align-items:center; height:8.4vh; border-radius:1.8vh; overflow:hidden; position:relative;

  #feudView .slot.reveal-anim { animation:fflip .55s cubic-bezier(.2,1.2,.4,1); }
  @keyframes fflip { 0%{transform:rotateX(90deg);} 100%{transform:rotateX(0);} }
  #feudView .teams-strip { flex:0 0 auto; display:flex; justify-content:center; margin-top:2.6vh; }
  #feudView .active-team { background:var(--cream); border:.45vh solid var(--ink); border-radius:2vh; padding:1.4vh 4vw; min-width:36vw; display:flex; align-items:center; justify-content:center; gap:2vw; box-shadow:.7vh .7vh 0 var(--orange), 1.1vh 1.1vh 0 var(--ink); }
  #feudView .ts-name { font-family:var(--groovy); font-size:4vh; color:var(--ink); }
  #feudView .ts-xs { display:flex; gap:1.4vh; }
  #feudView .team-x { font-family:var(--round); font-weight:700; font-size:5vh; line-height:1; color:#c9c1b2; transition:color .2s; }
  #feudView .team-x.on { color:#e5241b; -webkit-text-stroke:.25vh var(--ink); }
  #feudView .offline-note { margin:auto; color:var(--muted); font-family:var(--round); font-size:3vh; text-align:center; }
  #bigX { position:fixed; inset:0; margin:auto; width:46vh; height:46vh; display:flex; align-items:center; justify-content:center;
    font-family:var(--round); font-weight:700; font-size:40vh; line-height:1; color:#e5241b;
    -webkit-text-stroke:1.2vh var(--ink); paint-order:stroke fill; text-shadow:1.4vh 1.4vh 0 var(--ink);
    opacity:0; pointer-events:none; z-index:40; transform:scale(.4); }
  #bigX.show { animation:xflash 1s ease-out; }
  @keyframes xflash { 0%{opacity:0;transform:scale(.4) rotate(-12deg);} 15%{opacity:1;transform:scale(1.1) rotate(4deg);} 40%{opacity:1;transform:scale(1) rotate(0);} 100%{opacity:0;transform:scale(1);} }
  #muteBtn { position:fixed; top:1.5vh; left:2vw; z-index:45; background:var(--cream); color:var(--ink); border:.3vh solid var(--ink); border-radius:999px; padding:.9vh 2vh; font-family:var(--round); font-size:1.8vh; font-weight:700; cursor:pointer; box-shadow:.4vh .4vh 0 var(--ink); }
  @media (prefers-reduced-motion: reduce) { #feudView .slot.reveal-anim { animation:none; } }

  /* ---------- Title screens: "Trivia Starting Soon" / "Trivia Night" ---------- */
  .title-view { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .tt-card {

  }

  .tt-main { font-family:var(--groovy); font-size:15vh; line-height:1.05; margin-top:3vh; white-space:nowrap; }
  .tt-main .soon { color:var(--sun); display:block; font-size:.78em; }

  .tt-dots span { width:2.4vh; height:2.4vh; border-radius:50%; border:.35vh solid var(--ink); animation: dotpulse 1.4s ease-in-out infinite; }
  .tt-dots span:nth-child(1){ background:var(--orange); } .tt-dots span:nth-child(2){ background:var(--sun); animation-delay:.2s; } .tt-dots span:nth-child(3){ background:var(--neon); animation-delay:.4s; }
  @keyframes dotpulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.15); } }
  .tt-sub { margin-top:3vh; font-family:var(--round); font-size:2.8vh; font-weight:500; color:var(--cream); letter-spacing:.15vh; }

  .live-dot { position:fixed; top:1.5vh; right:2vw; width:1.2vh; height:1.2vh; border-radius:50%; background:var(--lime); opacity:.4; transition:opacity .3s; }

</style>
</head>
<body>
  <div class="live-dot" id="dot"></div>

  <!-- LEADERBOARD VIEW -->
  <div id="leaderboardView">
    <div id="lbRoot">
      <div class="empty"><img src="assets/mandarin-logo.png" alt="Kava &amp; Co. Mandarin"><div class="msg">Standings will appear here</div></div>
    </div>
  </div>

  <!-- WHEEL VIEW -->
  <div id="wheelView" class="wheel-wrap hidden">
    <div class="wheel-holder">
      <div class="pointer"></div>
      <svg id="tvwheel" viewBox="0 0 400 400" role="img" aria-label="Team spinner"></svg>
      <div class="hub"></div>
    </div>
    <div class="winner-banner retro" id="winnerBanner"></div>
  </div>

  <!-- MUSIC ROUND VIEW -->
  <div id="songView" class="song-wrap hidden">
    <div class="song-kicker">Music Round</div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="song-label retro">Song</div>
    <div class="song-num" id="songNum">1</div>
    <div class="song-dots" id="songDots"></div>
  </div>

  <!-- TITLE SCREEN VIEW -->
  <div id="titleView" class="title-view hidden"></div>

  <!-- JEOPARDY VIEW -->
  <div id="jeopView" class="jp-view hidden"><div id="jpRoot"></div></div>
  <button id="soundChip" hidden>&#128264; Click here once so the TV can play sound</button>

  <!-- QR CARD VIEW -->
  <div id="qrView" class="qr-view hidden">
    <div class="qr-label retro" id="qrLabel"></div>
    <div class="qr-box" id="qrBox"></div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="qr-teams" id="qrTeams"></div>
  </div>
  <div id="feudBuzz" hidden></div>

  <!-- FEUD VIEW -->
  <div id="feudView" class="hidden">
    <button id="muteBtn" onclick="toggleMute()">&#128266; Sound on</button>
    <div id="feudRoot"></div>
  </div>
  <div id="bigX">&#10007;</div>
  <canvas id="confetti" hidden></canvas>
  <img id="manny" src="assets/manny.png" alt="">

<script>
const API = "/.netlify/functions/scores";
const R = 200, CX = 200, CY = 200;
const dot = document.getElementById("dot");
const lbRoot = document.getElementById("lbRoot");
const leaderboardView = document.getElementById("leaderboardView");
const wheelView = document.getElementById("wheelView");
const tvwheel = document.getElementById("tvwheel");
const winnerBanner = document.getElementById("winnerBanner");

let lastLbSig = "";
let lastWheelSig = "";
let lastSpinToken = null;
let tvRotation = 0;
let currentDisplay = "leaderboard";
let latestTeams = [];

function pulse(){ dot.classList.add("ping"); setTimeout(()=>dot.classList.remove("ping"),300); }
function escapeHtml(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}
function polar(cx,cy,r,angle){const a=(angle-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function pickTextColor(hex){const c=(hex||"#45DBE0").replace("#","");const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*0.299+g*0.587+b*0.114)>150?"#000":"#fff";}

/* ---------- Draw the wheel from a given team order ---------- */
function drawTVWheel(activeTeams){
  const n = activeTeams.length;
  tvwheel.innerHTML = "";
  const NS = "http://www.w3.org/2000/svg";
  if (n === 0) {
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",CX);c.setAttribute("cy",CY);c.setAttribute("r",R);c.setAttribute("fill","#163f23");
    tvwheel.appendChild(c); return;
  }
  if (n === 1) {
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",CX);c.setAttribute("cy",CY);c.setAttribute("r",R);
    c.setAttribute("fill",activeTeams[0].color);c.setAttribute("stroke","#000");c.setAttribute("stroke-width","1.5");
    tvwheel.appendChild(c);
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",CX);t.setAttribute("y",CY);t.setAttribute("fill",pickTextColor(activeTeams[0].color));
    t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");
    t.setAttribute("font-size","18");t.setAttribute("font-weight","700");
    t.textContent=activeTeams[0].name||"Team"; tvwheel.appendChild(t); return;
  }
  const arc = 360/n;
  activeTeams.forEach((team,i)=>{
    const start=i*arc, end=start+arc;
    const [x1,y1]=polar(CX,CY,R,start), [x2,y2]=polar(CX,CY,R,end);
    const large = arc>180?1:0, mid=start+arc/2;
    const path=document.createElementNS(NS,"path");
    path.setAttribute("d",`M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z`);
    path.setAttribute("fill",team.color);path.setAttribute("stroke","#000");path.setAttribute("stroke-width","1.5");
    tvwheel.appendChild(path);
    if (team.name){
      const [tx,ty]=polar(CX,CY,R*0.64,mid);
      const text=document.createElementNS(NS,"text");
      text.setAttribute("x",tx);text.setAttribute("y",ty);
      text.setAttribute("fill",pickTextColor(team.color));
      text.setAttribute("text-anchor","middle");text.setAttribute("dominant-baseline","middle");
      text.setAttribute("font-size",n>12?"11":"15");text.setAttribute("font-weight","700");
      text.setAttribute("transform",`rotate(${mid} ${tx} ${ty})`);
      let lbl=team.name; if(lbl.length>16)lbl=lbl.slice(0,15)+"\u2026";
      text.textContent=lbl; tvwheel.appendChild(text);
    }
  });
}

/* ---------- Animate a spin to the winner ---------- */
function runSpin(order, winnerId, turns){
  // order = array of team ids currently on the wheel (matches host)
  const activeTeams = order.map(id => latestTeams.find(t => t.id === id)).filter(Boolean);
  if (!activeTeams.length) return;
  drawTVWheel(activeTeams);

  const n = activeTeams.length;
  const arc = 360/n;
  const winnerIdx = activeTeams.findIndex(t => t.id === winnerId);
  if (winnerIdx < 0) return;
  const winnerCenter = winnerIdx*arc + arc/2;
  const target = turns*360 + (360 - winnerCenter);

  // reset transition then animate
  winnerBanner.classList.remove("show");
  tvwheel.style.transition = "none";
  tvwheel.style.transform = `rotate(${tvRotation % 360}deg)`;
  // force reflow so the reset takes effect before the animated transform
  void tvwheel.offsetWidth;
  tvwheel.style.transition = "transform 5s cubic-bezier(.17,.67,.28,1)";
  tvRotation = target;
  tvwheel.style.transform = `rotate(${tvRotation}deg)`;

  const winner = activeTeams[winnerIdx];
  setTimeout(() => {
    winnerBanner.textContent = (winner.name || "Team") + "!";
    winnerBanner.classList.add("show");
  }, 5100);
}

/* ---------- Leaderboard render ---------- */
// reveal = null for the normal leaderboard, or { order:[team ids, 1st place first], shown:n }
// for a reveal: rows stay face-down and flip over from last place up to 1st.
let prevShown = null;
function renderLeaderboard(teams, reveal){
  const LOGO = `<img class="lb-logo" src="assets/mandarin-logo.png" alt="Kava &amp; Co. Mandarin">`;
  let ranked;
  if (reveal && Array.isArray(reveal.order)) ranked = reveal.order.map(id => teams.find(t => t.id === id)).filter(Boolean);
  else ranked = teams.filter(t => (t.name && t.name.trim()) || t.score).sort((a,b) => b.score - a.score);
  if (!ranked.length) {
    if (lastLbSig === "empty") return;
    lastLbSig = "empty"; prevShown = null;
    lbRoot.innerHTML = `<div class="empty"><img src="assets/mandarin-logo.png" alt="Kava &amp; Co. Mandarin"><div class="msg">Standings will appear here</div></div>`;
    return;
  }
  const n = ranked.length;
  const shown = reveal ? Math.max(0, Math.min(n, Math.round(Number(reveal.shown) || 0))) : n;
  const sig = JSON.stringify([!!reveal, shown, ranked.map(t => [t.id, t.name, t.score, t.color])]);
  if (sig === lastLbSig) return;
  lastLbSig = sig;
  // rows that just flipped over since the last render (none on first load / refresh)
  const before = (reveal && prevShown !== null && prevShown <= shown) ? prevShown : shown;
  prevShown = reveal ? shown : null;

  const maxScore = Math.max(...ranked.map(t => t.score), 0);
  let lastScore = null, lastRank = 0;
  const rows = ranked.map((t, i) => {
    const rank = (t.score === lastScore) ? lastRank : i + 1; lastScore = t.score; lastRank = rank;
    const up = i >= n - shown;                     // face-up?
    const justNow = reveal && up && i < n - before;
    if (!up) return `<div class="row face-down"><div class="rank">${rank}</div><div class="name">? ? ?</div></div>`;
    const leader = t.score === maxScore && maxScore > 0;
    const cls = ["row", leader ? "leader" : "", justNow ? (i === 0 ? "champ" : "flip") : ""].join(" ");
    return `<div class="${cls}">
      <div class="rank">${rank}</div>
      <div class="swatch" style="background:${escapeHtml(t.color || "#F36F03")}"></div>
      <div class="name">${escapeHtml(t.name || "Team")}${leader ? '<span class="crown">\u{1F451}</span>' : ''}</div>
      <div class="score">${(t.score || 0).toLocaleString()}</div>
    </div>`;
  }).join("");
  const title = !reveal ? "Standings" : (shown === n ? "Champions!" : "Final Standings");
  lbRoot.innerHTML = `
    <div class="lb-head">${LOGO}<div class="lb-title retro">${title}</div></div>
    <div class="board">${rows}</div>`;
  if (reveal && shown === n && before < n) { confetti(); mannyParty(); }
}

/* Manny celebrates the winner, then goes back to peeking */
function mannyParty(){
  const m = document.getElementById("manny");
  m.classList.remove("party"); void m.offsetWidth; m.classList.add("party");
  clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove("party"), 6700);
}

/* ---------- Confetti for the winner reveal ---------- */
function confetti(){
  const cv = document.getElementById("confetti");
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight, ctx = cv.getContext("2d");
  const colors = ["#F36F03", "#F0BF17", "#34E209", "#FFF3E0", "#5f951f", "#C0FF5B"];
  const bits = Array.from({ length: 220 }, () => ({
    x: Math.random() * W, y: -Math.random() * H * .6, w: 8 + Math.random() * 10, h: 6 + Math.random() * 8,
    vx: (Math.random() - .5) * 3, vy: 3 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => {
      b.x += b.vx; b.y += b.vy; b.r += b.vr; b.vy += .03;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.strokeStyle = "#0b0800"; ctx.lineWidth = 1.5; ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
      ctx.restore();
    });
    if (t - t0 < 6500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}

const songView = document.getElementById("songView");
let lastSongSig = "";
function renderSong(song){
  const n = (song && song.n) || 1, total = (song && song.total) || 0;
  const sig = n + "/" + total;
  if (sig === lastSongSig) return;
  lastSongSig = sig;
  const num = document.getElementById("songNum");
  num.textContent = n;
  num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
  let dots = "";
  for (let i = 1; i <= total; i++) dots += `<span class="${i < n ? "done" : i === n ? "now" : ""}"></span>`;
  document.getElementById("songDots").innerHTML = dots;
}

function showView(display){
  if (display === currentDisplay) return;
  currentDisplay = display;
  wheelView.classList.toggle("hidden", display !== "wheel");
  leaderboardView.classList.toggle("hidden", display !== "leaderboard" && display !== "reveal");
  document.body.classList.toggle("title-mode", display === "title");
  prevShown = null;
  songView.classList.toggle("hidden", display !== "song");
  qrView.classList.toggle("hidden", display !== "qr");
  titleView.classList.toggle("hidden", display !== "title");
  jeopView.classList.toggle("hidden", display !== "jeopardy");
  setTimeout(paintTVBuzz, 0);
  document.body.classList.toggle("jp-mode", display === "jeopardy");
  if (display !== "jeopardy") stopJeopardyMedia();
  lastJpSig = "";
  lastTitleSig = "";
  feudView.classList.toggle("hidden", display !== "feud");
  lastSongSig = ""; lastQrSig = ""; lastFeudSig = ""; lastStrikeEvent = null; prevRevealed = {};
  // force re-render of whichever is now visible
  lastLbSig = ""; lastWheelSig = "";
}

let spinEndsAt = 0;

async function tick(){
  let data;
  try { const res = await fetch(API + "?action=status",{cache:"no-store"}); data = await res.json(); pulse(); }
  catch(e){ return; }

  latestTeams = (data.teams||[]).map(t => ({ id:t.id, name:t.name, score:t.score, color:t.color, out:!!t.out }));

  // spin command? run it once per new token (also flips view to wheel)
  if (data.spin && data.spin.token && data.spin.token !== lastSpinToken) {
    lastSpinToken = data.spin.token;
    showView("wheel");
    spinEndsAt = Date.now() + 5200;
    runSpin(data.spin.order || [], data.spin.winnerId, data.spin.turns || 6);
  }

  // display switch from host
  showView(["wheel", "song", "qr", "feud", "title", "reveal", "jeopardy"].includes(data.display) ? data.display : "leaderboard");
  if (typeof data.now === "number") serverOffset = data.now - Date.now();
  if (data.links && data.links.feud) feudBase = data.links.feud.replace(/\/+$/, "");

  if (currentDisplay === "leaderboard") {
    renderLeaderboard(latestTeams, null);
  } else if (currentDisplay === "reveal") {
    renderLeaderboard(latestTeams, data.reveal);
  } else if (currentDisplay === "song") {
    renderSong(data.song);
  } else if (currentDisplay === "qr") {
    renderQrCard(data.qr);
  } else if (currentDisplay === "title") {
    renderTitle(data.title);
  } else if (currentDisplay === "jeopardy") {
    renderJeopardyTV(data.jeopardyTV);
  } else if (currentDisplay === "feud") {
    await feudTick();
  } else {
    // keep the wheel drawn with current teams when idle (never mid-spin)
    const active = latestTeams.filter(t => !t.out);
    const sig = JSON.stringify(active.map(t=>[t.id,t.name,t.color]));
    if (sig !== lastWheelSig && Date.now() > spinEndsAt) {
      lastWheelSig = sig;
      drawTVWheel(active);
    }
  }
}

/* ---------- Jeopardy ---------- */
const jeopView = document.getElementById("jeopView");
const jpRoot = document.getElementById("jpRoot");
let lastJpSig = "", lastJpCats = 0, serverOffset = 0, jpData = null, lastMediaN = null;
let soundUnlocked = false, ytApi = null, ytPlayerJ = null, timerLoop = null, timeUpBeeped = false;
const soundChip = document.getElementById("soundChip");
// Browsers only let a page play sound after someone has clicked it once.
function unlockSound(){
  soundUnlocked = true; soundChip.hidden = true;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch(e) {}
}
document.addEventListener("pointerdown", unlockSound, { once: false });
soundChip.onclick = unlockSound;

function ytIdOf(u){
  try {
    const x = new URL(u); const h = x.hostname.replace(/^(www|m|music)\./, "");
    if (h === "youtu.be") return x.pathname.slice(1, 12);
    if (/(^|\.)youtube(-nocookie)?\.com$/.test(h)) return x.searchParams.get("v") || ((x.pathname.match(/^\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{11})/) || [])[1]) || null;
  } catch(e) {}
  return null;
}
function loadYT(){
  if (ytApi) return ytApi;
  ytApi = new Promise(res => {
    window.onYouTubeIframeAPIReady = () => res(window.YT);
    const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
  });
  return ytApi;
}
function stopJeopardyMedia(){
  try { if (ytPlayerJ) ytPlayerJ.destroy(); } catch(e) {}
  ytPlayerJ = null;
  jpRoot.querySelectorAll("audio,video").forEach(m => { try { m.pause(); } catch(e) {} });
  clearInterval(timerLoop); timerLoop = null;
}
function mediaEl(){ return jpRoot.querySelector(".jq-media audio, .jq-media video"); }
function setEq(on){ const e = jpRoot.querySelector(".jq-audio"); if (e) e.classList.toggle("on", on); }
// Run a play / pause / restart press from the host (each press once)
// Which side the TV is showing: the response replaces the clue when it's a picture or a clip
function respTakesOver(cell){ const r = cell && cell.resp; return !!(r && r.type !== "text" && r.src); }
function activeSide(cell){ return !cell ? null : (respTakesOver(cell) ? cell.resp : cell.clue); }
// Run a play / pause / restart press from the host (each press once)
function runMediaCmd(cell){
  const mc = cell && cell.mediaCmd;
  if (!mc || mc.n === lastMediaN) return;
  if (!(ytPlayerJ && ytPlayerJ.playVideo) && !mediaEl()) return;   // player still loading: try again when it's ready
  lastMediaN = mc.n;
  const side = activeSide(cell);
  const start = (side && side.start) || 0;
  const fail = () => { soundChip.hidden = false; };
  if (ytPlayerJ && ytPlayerJ.playVideo) {
    if (mc.cmd === "pause") { ytPlayerJ.pauseVideo(); setEq(false); return; }
    if (mc.cmd === "restart") ytPlayerJ.seekTo(start, true);
    ytPlayerJ.playVideo(); setEq(true);
    if (!soundUnlocked) fail();
    return;
  }
  const m = mediaEl(); if (!m) return;
  if (mc.cmd === "pause") { m.pause(); setEq(false); return; }
  if (mc.cmd === "restart") m.currentTime = start;
  m.play().then(() => setEq(true)).catch(fail);
}
const EQ = `<div class="jq-audio"><i></i><i></i><i></i><i></i><i></i></div>`;
// Build the body for one side (clue or response): text, a picture, or an audio/video clip
function sideHTML(sd){
  if (!sd) return { html: "", media: false };
  const text = sd.text ? `<div class="jq-text">${escapeHtml(sd.text)}</div>` : "";
  if (sd.type === "image" && sd.src) return { html: `<div class="jq-media"><img src="${escapeHtml(sd.src)}" alt=""></div>${text}`, media: true };
  if (sd.type === "media" && sd.src) {
    const yt = ytIdOf(sd.src), hide = !sd.show;
    const isAudioFile = /\.(mp3|m4a|wav|ogg|oga|aac|flac)$/i.test(sd.src.split(/[?#]/)[0]);
    let m;
    if (yt) m = `<div class="jq-media${hide ? " audio-only" : ""}">${hide ? EQ : ""}<div class="yt"><div id="jqYT"></div></div></div>`;
    else if (hide || isAudioFile) m = `<div class="jq-media audio-only">${EQ}<audio preload="auto" src="${escapeHtml(sd.src)}"></audio></div>`;
    else m = `<div class="jq-media"><video preload="auto" playsinline src="${escapeHtml(sd.src)}"></video></div>`;
    if (yt) loadYT().then(YT => {
      if (!document.getElementById("jqYT")) return;
      ytPlayerJ = new YT.Player("jqYT", { videoId: yt, playerVars: { start: sd.start || 0, rel: 0, modestbranding: 1, playsinline: 1, controls: 0 },
        events: { onReady: () => runMediaCmd(jpData && jpData.cell), onStateChange: e => setEq(e.data === 1) } });
    });
    return { html: m + text, media: true, clip: true };
  }
  return { html: text, media: false };
}
function renderJeopardyTV(jt){
  if (!jt) return;
  jpData = jt;
  const cell = jt.cell;
  const gamble = jt.kind === "gamble";
  // A plain-text answer is a banner added without a rebuild, so showing it doesn't restart a playing clip.
  const side = activeSide(cell);
  const sig = JSON.stringify([jt.board, jt.kind, jt.name, jt.values, jt.cats, jt.used,
    cell && [cell.c, cell.r, cell.cat, cell.value, cell.stage === "pick", respTakesOver(cell), side]]);
  if (sig !== lastJpSig) {
    lastJpSig = sig;
    stopJeopardyMedia();
    // presses made before this question appeared (or before a TV refresh) don't replay
    lastMediaN = cell && cell.mediaCmd ? cell.mediaCmd.n : 0;
    const top = `<div class="jb-top"><img src="assets/mandarin-logo.png" alt=""><div class="jb-name retro">${escapeHtml(jt.name || "")}</div></div>`;
    if (!cell && gamble) {
      let h = top + `<div class="jb-sub">Pick a category &middot; then place your wagers</div><div class="jb-gamble">`;
      jt.cats.forEach((name, i) => {
        const pop = name !== null && i >= lastJpCats ? " pop" : "";
        const used = jt.used[i];
        h += name === null
          ? `<div class="jb-t jb-head closed"><img src="assets/mandarin-logo.png" alt=""></div>`
          : `<div class="jb-t jb-head${pop}${used ? " used" : ""}"><span class="n">Category ${i + 1}</span>${escapeHtml(name || "Category " + (i + 1))}</div>`;
      });
      jpRoot.innerHTML = h + `</div>`;
      soundChip.hidden = true;
    } else if (!cell) {
      let h = top + `<div class="jb-grid">`;
      jt.cats.forEach((name, i) => {
        const pop = name !== null && i >= lastJpCats ? " pop" : "";
        h += name === null
          ? `<div class="jb-t jb-head closed"><img src="assets/mandarin-logo.png" alt=""></div>`
          : `<div class="jb-t jb-head${pop}">${escapeHtml(name || "Category " + (i + 1))}</div>`;
      });
      const nc = jt.cats.length;
      for (let r = 0; r < 5; r++) for (let c = 0; c < nc; c++) {
        const used = jt.used[r * nc + c];
        h += `<div class="jb-t jb-val${used ? " used" : ""}">${used ? "" : ((jt.values || [])[r] || 0).toLocaleString()}</div>`;
      }
      jpRoot.innerHTML = h + `</div>`;
      soundChip.hidden = true;
    } else {
      const meta = `<div class="jq-meta"><span>${escapeHtml(cell.cat || "")}</span><span class="v">${gamble ? "Gamble" : (cell.value || 0).toLocaleString()}</span></div>`;
      let body, clip = false, head = "";
      if (cell.stage === "pick") {
        body = `<div class="jq-body"><div class="jq-wager">Place your wagers!</div><div class="jq-wager-sub">Hand your wager to the host</div></div>`;
      } else {
        const sh = sideHTML(side); clip = !!sh.clip;
        if (respTakesOver(cell)) head = `<div class="jq-anshead">Answer</div>`;
        body = `<div class="jq-body${sh.media ? " has-media" : ""}">${sh.html}</div>`;
      }
      jpRoot.innerHTML = `
        <div class="jq-card">
          ${meta}${head}${body}
          <div class="jq-timer" hidden><div class="bar"><div class="fill"></div></div><div class="num"></div></div>
        </div>`;
      const me = mediaEl();
      if (me) {
        if (side && side.start) me.addEventListener("loadedmetadata", () => { me.currentTime = side.start; }, { once: true });
        me.addEventListener("ended", () => setEq(false));
      }
      // show the sound prompt only for audio/video, and only until someone clicks
      soundChip.hidden = soundUnlocked || !clip;
    }
    lastJpCats = jt.cats.filter(x => x !== null).length;
  }
  if (cell) {
    runMediaCmd(cell);
    // a text answer is a banner that comes and goes without rebuilding the card
    const card = jpRoot.querySelector(".jq-card"), ans = card && card.querySelector(".jq-ans");
    const txt = cell.resp && !respTakesOver(cell) ? (cell.resp.text || "") : "";
    const want = cell.stage === "answer" && cell.resp && !respTakesOver(cell);
    if (card && want && (!ans || ans.dataset.a !== txt)) {
      if (ans) ans.remove();
      const d = document.createElement("div"); d.className = "jq-ans"; d.dataset.a = txt;
      d.innerHTML = `<small>Answer</small>${escapeHtml(txt || "—")}`;
      card.insertBefore(d, card.querySelector(".jq-timer"));
    } else if (card && !want && ans) ans.remove();
  }
  // answer timer (uses the server's clock so the laptop and TV agree)
  const tEl = jpRoot.querySelector(".jq-timer");
  if (tEl) {
    if (!jt.timer) { tEl.hidden = true; clearInterval(timerLoop); timerLoop = null; timeUpBeeped = false; }
    else if (!timerLoop) {
      tEl.hidden = false; timeUpBeeped = false;
      const tick = () => {
        const t = jpData && jpData.timer; if (!t) return;
        const left = Math.max(0, (t.endsAt - (Date.now() + serverOffset)) / 1000);
        tEl.querySelector(".fill").style.transform = `scaleX(${left / t.secs})`;
        tEl.querySelector(".num").textContent = left > 0 ? Math.ceil(left) : "Time!";
        tEl.classList.toggle("out", left <= 0);
        if (left <= 0 && !timeUpBeeped) { timeUpBeeped = true; if (soundUnlocked) buzzer(); }
      };
      tick(); timerLoop = setInterval(tick, 100);
    }
  }
  paintTVBuzz();
}

/* ---------- Phone buzzers (filled in by the module at the bottom) ---------- */
window.TVBuzz = { state: {}, order: [], teams: {} };
let lastBuzzKey = "";
function ding(){
  if (muted || !soundUnlocked) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [[988, 0], [1319, 0.11]].forEach(([f, t]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(f, now + t);
      g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(0.4, now + t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.35);
      o.connect(g); g.connect(audioCtx.destination); o.start(now + t); o.stop(now + t + 0.36);
    });
  } catch(e) {}
}
// buzz-in countdown next to the team name (updated several times a second)
let lastTimeUpKey = "";
function tickTVBuzzTimer(){
  const T = window.TVBuzz, els = document.querySelectorAll(".jq-bzt, .fb-bzt");
  const c = T.clock ? T.clock() : null;
  els.forEach(el => {
    if (!c || c.stopped) { el.textContent = ""; return; }
    const s = Math.ceil(c.left / 1000);
    el.textContent = c.done ? "Time!" : String(s);
    el.classList.toggle("done", c.done); el.classList.toggle("low", !c.done && s <= 3); el.classList.toggle("paused", c.paused);
  });
  // buzzer once when a team's time runs out (only if it's on screen)
  if (c && c.done && els.length) {
    const k = (T.state && T.state.round) + c.team;
    if (k !== lastTimeUpKey) { lastTimeUpKey = k; if (soundUnlocked) buzzer(); }
  }
}
setInterval(tickTVBuzzTimer, 150);
function paintTVBuzz(){
  const T = window.TVBuzz, st = T.state || {}, first = st.test ? null : T.order[0];
  const ft = first ? (T.teams[first.team] || { name: "A team" }) : null;
  const open = !!st.open && !st.test;
  // a new first buzz: ding (only where it shows)
  const key = first ? st.round + first.team : "";
  const where = currentDisplay === "feud" || (currentDisplay === "jeopardy" && jpData && jpData.cell && jpData.kind !== "gamble" && jpData.cell.stage !== "pick");
  const isNew = key && key !== lastBuzzKey;
  lastBuzzKey = key;
  if (isNew && where) ding();
  // Jeopardy clue card: a strip under the category
  const card = currentDisplay === "jeopardy" ? jpRoot.querySelector(".jq-card") : null;
  let strip = card && card.querySelector(".jq-buzz");
  const showJ = card && where && (first || open);
  if (!showJ) { if (strip) strip.remove(); }
  else {
    const html = first ? `<i style="background:${escapeHtml(ft.color || "#F36F03")}"></i>${escapeHtml(ft.name)} <small>buzzed in!</small><span class="jq-bzt"></span>` : `Buzzers open &mdash; buzz in!`;
    const cls = "jq-buzz " + (first ? "hit" : "open");
    if (!strip) { strip = document.createElement("div"); const after = card.querySelector(".jq-anshead") || card.querySelector(".jq-meta"); after.after(strip); }
    if (strip.dataset.k !== cls + html) { strip.dataset.k = cls + html; strip.className = cls; strip.innerHTML = html; }
  }
  // Feud board: a pill at the top
  const fb = document.getElementById("feudBuzz");
  const showF = currentDisplay === "feud" && (first || open);
  fb.hidden = !showF;
  if (showF) {
    const html = first ? `<i style="background:${escapeHtml(ft.color || "#F36F03")}"></i>${escapeHtml(ft.name)} buzzed first!<span class="fb-bzt"></span>` : `Buzzers open!`;
    const cls = first ? "hit" : "open";
    if (fb.dataset.k !== cls + html) { fb.dataset.k = cls + html; fb.className = cls; fb.innerHTML = html; }
  }
  tickTVBuzzTimer();
  // Join QR card: teams appear as they join
  const qt = document.getElementById("qrTeams");
  const list = (currentDisplay === "qr" && tvQr && tvQr.kind === "join") ? Object.values(T.teams).sort((a, b) => (a.at || 0) - (b.at || 0)) : [];
  const qh = list.map(t => `<span><i style="background:${escapeHtml(t.color || "#F36F03")}"></i>${escapeHtml(t.name)}</span>`).join("");
  if (qt.dataset.k !== qh) { qt.dataset.k = qh; qt.innerHTML = qh; }
}

}

/* ---------- Feud board (reads the Feud site's backend) ---------- */
const feudView = document.getElementById("feudView");
const feudRoot = document.getElementById("feudRoot");
let feudBase = "https://kavafeud.netlify.app";
let lastFeudSig = "";
let prevRevealed = {};
let lastStrikeEvent = null;
let muted = false;
let audioCtx = null;

function buzzer(){
  if (muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18].forEach((offset) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + offset); osc.stop(now + offset + 0.16);
    });
  } catch(e) {}
}
function flashBigX(){
  const el = document.getElementById("bigX");
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
window.toggleMute = function(){
  muted = !muted;
  document.getElementById("muteBtn").innerHTML = muted ? "&#128263; Muted" : "&#128266; Sound on";
  // tapping also unlocks audio on browsers that need a click first
  if (!muted) { try { audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state==="suspended") audioCtx.resume(); } catch(e){} }
};

async function feudTick(){
  const FAPI = feudBase + "/.netlify/functions/feud";
  let s;
  try { const res = await fetch(FAPI + "?action=status&view=screen", { cache:"no-store" }); s = await res.json(); }
  catch(e) {
    if (lastFeudSig !== "offline") { lastFeudSig = "offline"; feudRoot.innerHTML = `<div class="offline-note">Connecting to the Feud board&hellip;</div>`; }
    return;
  }
  // buzzer + big X when a new strike lands (ignore the count we found on arrival)
  if (typeof s.strikeEvent === "number") {
    if (lastStrikeEvent === null) lastStrikeEvent = s.strikeEvent;
    else if (s.strikeEvent > lastStrikeEvent) { lastStrikeEvent = s.strikeEvent; buzzer(); flashBigX(); }
  }

  if (!s.board || !s.board.slots || !s.board.slots.length) {
    // No board loaded: show the survey QR if a survey is live, else a "get ready" screen
    let phone = null;
    try { const pr = await fetch(FAPI + "?action=status&view=phone", { cache:"no-store" }); phone = await pr.json(); } catch(e) {}
    const live = phone && phone.surveyId;
    const sig = "idle:" + (live ? phone.surveyId + phone.title : "none") + feudBase;
    if (sig === lastFeudSig) return;
    lastFeudSig = sig; prevRevealed = {};
    if (live) {
      feudRoot.innerHTML = `<div class="idle">
          <img class="flogo" src="assets/mandarin-logo.png" alt="Kava &amp; Co. Mandarin">
          <div class="scan-cta retro">Scan to take the survey</div>
          <div class="qr-wrap" id="feudQr"></div>
          <div class="scan-sub">${escapeHtml(phone.title || "")} — answer on your phone!</div>
        </div>`;
      drawQR(document.getElementById("feudQr"), feudBase + "/feud-survey.html", 300);
    } else {
      feudRoot.innerHTML = `<div class="idle"><img class="flogo" src="assets/mandarin-logo.png" alt="Kava &amp; Co. Mandarin"><div class="tag retro">Feud &mdash; get ready to play!</div></div>`;
    }
    return;
  }

  const strikes = s.strikes || 0;
  const sig = JSON.stringify({ q: s.question, slots: s.board.slots.map(x => [x.text, x.count, x.revealed]), strikes });
  if (sig === lastFeudSig) return;
  lastFeudSig = sig;
  const slotsHtml = s.board.slots.map((sl, i) => `
    <div class="slot ${sl.revealed ? "" : "covered"}" data-i="${i}">
      <div class="num-chip">${i+1}</div>
      <div class="num">${i+1}</div>
      <div class="content"><span class="answer">${escapeHtml(sl.text)}</span><span class="count">${sl.count}</span></div>
    </div>`).join("");
  const xs = [1,2,3].map(n => `<span class="team-x ${n <= strikes ? "on":""}">\u2715</span>`).join("");
  feudRoot.innerHTML = `
    <div class="fheader"><div class="kicker retro">Survey Says&hellip;</div><div class="question">${escapeHtml(s.question || "")}</div></div>
    <div class="fboard">${slotsHtml}</div>
    <div class="teams-strip"><div class="active-team"><div class="ts-name">Strikes</div><div class="ts-xs">${xs}</div></div></div>`;
  s.board.slots.forEach((sl, i) => {
    if (sl.revealed && !prevRevealed[i]) { const el = feudRoot.querySelector(`.slot[data-i="${i}"]`); if (el) el.classList.add("reveal-anim"); }
    prevRevealed[i] = sl.revealed;
  });
}
// feudRoot needs flex layout to fill the screen like feud-screen's body
feudRoot.style.cssText = "flex:1 1 auto; display:flex; flex-direction:column; min-height:0;";

tick();
setInterval(tick, 1200);
</script>
<script type="module">
// Phone buzzers: the TV only reads (who joined, buzzers open, who buzzed first).
import { connectBuzz, buzzOrder, answerClock } from "./kava-buzz.js";
const T = window.TVBuzz;
T.offset = 0;
T.clock = () => answerClock(T.state, T.order, Date.now() + T.offset);
let unsub = null, watched = null;
try {
  const fb = await connectBuzz();
  fb.serverOffset(o => { T.offset = o; });
  fb.watch("game/teams", v => { T.teams = v || {}; paintTVBuzz(); });
  fb.watch("game/buzz", v => {
    T.state = v || {};
    if (T.state.round !== watched) {
      if (unsub) unsub();
      watched = T.state.round || null; T.order = [];
      unsub = watched ? fb.watch("game/buzzes/" + watched, b => { T.order = buzzOrder(b); paintTVBuzz(); }) : null;
    }
    paintTVBuzz();
  });
} catch (e) { console.warn("Buzzers not available on the TV:", e && e.message); }
</script>
