<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Wheel &amp; Scoreboard</title>
<style>
  :root {
    --bg: #07141a;
    --panel: #0f2830;
    --panel-2: #143540;
    --line: #1f4a52;
    --ink: #f5f5f5;
    --muted: #7fa8b0;
    --accent: #45DBE0;
    --focus: #45DBE0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 420px;
    height: 100vh;
  }

  /* ---- Wheel stage ---- */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    min-width: 0;
  }
  .wheel-holder {
    position: relative;
    width: min(78vh, 90%);
    aspect-ratio: 1;
  }
  .pointer {
    position: absolute;
    top: -8px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 40px solid var(--accent);
    z-index: 5;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.7));
  }
  svg#wheel {
    width: 100%; height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 0 0 8px #000, 0 0 0 12px var(--accent), 0 24px 60px rgba(0,0,0,.6);
    transition: transform 5s cubic-bezier(.17,.67,.28,1);
    cursor: pointer;
  }
  .hub {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--accent);
    border: 5px solid #000;
    z-index: 4;
    box-shadow: 0 4px 12px rgba(0,0,0,.6);
  }
  #spinBtn {
    background: var(--accent);
    color: #000;
    border: none;
    font-size: 18px; font-weight: 800;
    letter-spacing: 2px;
    padding: 15px 52px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
    transition: transform .1s ease, filter .15s ease;
    text-transform: uppercase;
  }
  #spinBtn:hover { filter: brightness(.9); }
  #spinBtn:active { transform: translateY(2px); }
  #spinBtn:disabled { opacity: .4; cursor: not-allowed; }
  .result {
    min-height: 34px;
    font-size: 24px; font-weight: 700;
    text-align: center;
  }
  .result .lbl { color: var(--muted); font-weight: 400; font-size: 13px; display:block; text-transform: uppercase; letter-spacing: 1px; }
  .result .val { color: var(--accent); }
  .result-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .remove-btn {
    background: transparent;
    border: 1px solid #b5484e;
    color: #d9736f;
    padding: 9px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s ease;
  }
  .remove-btn:hover { background: #b5484e; color: #fff; }
  .toolbar button:disabled { opacity: .4; cursor: not-allowed; }
  .toolbar button:disabled:hover { border-color: var(--line); }

  /* ---- Sidebar ---- */
  .sidebar {
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
  }
  .side-head {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .side-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side-head h2 {
    margin: 0;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .side-head .sub { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); word-break: break-all; line-height: 1.4; }
  .side-head .sub b { color: var(--accent); font-weight: 600; }
  #historyBtn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  #historyBtn:hover, #historyBtn.open { border-color: var(--accent); color: var(--accent); }

  .toolbar {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar button {
    flex: 1 1 calc(33% - 6px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 7px 4px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    transition: all .12s ease;
    white-space: nowrap;
  }
  .toolbar button:hover { border-color: var(--accent); }
  .toolbar button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .toolbar button.primary:hover { filter: brightness(.9); }

  .team-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  /* Each team = two lines: [name + total] / [points + bid controls] */
  .team-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 5px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
    transition: background .3s ease;
    flex: 0 0 auto;
  }
  .row-top { display: flex; align-items: center; gap: 7px; }
  .row-bottom { display: flex; align-items: center; gap: 4px; }
  .row-bottom .score-box { margin-right: auto; }
  .bet-box { display: flex; align-items: center; gap: 4px; }
  .bet-label {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-right: 2px;
  }
  .bet-input {
    width: 58px;
    background: #000; border: 1px solid var(--line);
    color: var(--ink); font-size: 14px; font-weight: 700;
    padding: 4px 6px; border-radius: 7px; text-align: right;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .bet-input::-webkit-outer-spin-button,
  .bet-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .bet-input:focus { outline: none; border-color: var(--accent); }
  .bet-btn {
    background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); cursor: pointer;
    padding: 5px 8px; height: 28px;
    border-radius: 7px; font-size: 11.5px; font-weight: 700;
    white-space: nowrap; flex: 0 0 auto;
    transition: all .1s ease;
  }
  .bet-btn.allin { letter-spacing: .3px; }
  .bet-btn.allin:hover { border-color: #f5c518; color: #f5c518; background: rgba(245,197,24,.12); }
  .bet-btn.won:hover { border-color: #3cb44b; color: #6ee08a; background: rgba(60,180,75,.14); }
  .bet-btn.lost:hover { border-color: #b5484e; color: #d9736f; background: rgba(181,72,78,.14); }
  .team-row.leader { border-color: var(--accent); }
  .rank {
    font-size: 12px; color: var(--muted);
    width: 20px; text-align: center; flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
  }
  .swatch {
    width: 22px; height: 22px; border-radius: 6px;
    border: 1px solid var(--line); cursor: pointer; flex: 0 0 auto;
    padding: 0; overflow: hidden; background: none;
  }
  .team-row input[type=text] {
    flex: 1 1 auto;
    background: transparent; border: none;
    color: var(--ink); font-size: 15px;
    padding: 4px 2px; min-width: 0;
  }
  .team-row input[type=text]:focus { outline: none; }
  .name-input {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    line-height: 1.3;
    padding: 2px;
    resize: none;
    overflow: hidden;
    word-break: break-word;
  }
  .name-input:focus { outline: none; }
  .name-input::placeholder { color: var(--muted); font-weight: 400; }
  .score-box {
    display: flex; align-items: center; gap: 3px;
    flex: 0 0 auto;
  }
  .team-row input[type=number] {
    background: #000;
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    padding: 4px 6px;
    border-radius: 7px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .team-row input[type=number]::-webkit-outer-spin-button,
  .team-row input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .team-row input[type=number]:focus { outline: none; border-color: var(--accent); }
  .amt-input { width: 54px; color: var(--muted) !important; font-weight: 500 !important; }
  .amt-input:focus { color: var(--ink) !important; }
  /* Total is now a clear DISPLAY, visually distinct from the amount input */
  .total-display {
    min-width: 74px; padding: 3px 10px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--accent);
    color: var(--ink); font-size: 17px; font-weight: 800;
    text-align: right; font-variant-numeric: tabular-nums;
    margin-left: 4px;
  }
  .edit-total-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer; margin-left: 2px;
  }
  .edit-total-btn:hover { border-color: var(--accent); color: var(--accent); }
  .op-btn {
    background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); cursor: pointer;
    width: 26px; height: 28px; line-height: 1;
    border-radius: 7px; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    padding: 0; flex: 0 0 auto;
    transition: all .1s ease;
  }
  .op-btn.plus:hover { border-color: #3cb44b; color: #6ee08a; background: rgba(60,180,75,.12); }
  .op-btn.minus:hover { border-color: #b5484e; color: #d9736f; background: rgba(181,72,78,.12); }
  .del-btn {
    background: transparent; border: 1px solid var(--line);
    color: var(--muted); border-radius: 7px;
    width: 26px; height: 28px; cursor: pointer;
    font-size: 13px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .del-btn:hover { border-color: #b5484e; color: #d9736f; }

  /* Crowded roster: tighten everything so all teams stay on screen */
  .team-list.dense { gap: 3px; padding-top: 6px; padding-bottom: 6px; }
  .team-list.dense .team-row { padding: 3px 8px; gap: 2px; }
  .team-list.dense .name-input { font-size: 14px; padding: 1px 2px; line-height: 1.25; }
  .team-list.dense .total-display { font-size: 15px; padding: 2px 8px; }
  .team-list.dense .op-btn, .team-list.dense .del-btn,
  .team-list.dense .bet-btn { height: 24px; }
  .team-list.dense .edit-total-btn { padding: 2px 7px; }
  .team-list.dense .swatch { width: 18px; height: 18px; }
  .team-list.dense .team-row input[type=number] { padding: 3px 6px; font-size: 13px; }
  .music-foot:empty { display: none; }

  .side-foot {
    padding: 8px 16px 10px;
    border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px;
  }
  .add-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--muted);
    padding: 8px; border-radius: 10px;
    cursor: pointer; font-size: 14px;
    transition: all .12s ease;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .step-config {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .step-config input {
    width: 80px; background: #000; border: 1px solid var(--line);
    color: var(--ink); padding: 5px 8px; border-radius: 7px;
    font-size: 13px; text-align: right;
  }
  .step-config input:focus { outline: none; border-color: var(--accent); }
  .toggle-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .toggle-row input { accent-color: var(--accent); width: 15px; height: 15px; }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---- View switch (this laptop screen): Wheel / Leaderboard / Music ---- */
  #viewSwitch {
    position: fixed;
    top: 18px; left: 18px;
    z-index: 40;
    display: flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  #viewSwitch button {
    background: transparent; border: none; color: var(--muted);
    padding: 7px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .15s ease;
  }
  #viewSwitch button:hover { color: var(--ink); }
  #viewSwitch button.on { background: var(--panel-2); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  #tvToggle {
    position: fixed;
    top: 18px; left: 344px;
    z-index: 40;
    background: var(--accent); color: #000;
    border: 1px solid var(--accent);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; transition: all .15s ease;
  }
  #tvToggle:hover { filter: brightness(.92); }

  /* ---- Leaderboard ---- */
  .board-stage {
    justify-content: flex-start;
    padding: 70px 40px 40px;
    overflow-y: auto;
  }
  .board-title {
    margin: 0 0 24px;
    font-size: clamp(28px, 4.5vh, 52px);
    letter-spacing: 6px;
    text-transform: uppercase;
    font-weight: 800;
    text-align: center;
  }
  .board {
    width: 100%;
    max-width: 1100px;
    --bscale: 1;
    display: flex;
    flex-direction: column;
    gap: calc(clamp(8px, 1.4vh, 16px) * var(--bscale));
  }
  .board-row {
    display: flex;
    align-items: center;
    gap: clamp(12px, 2vw, 28px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 10px solid var(--line);
    border-radius: 14px;
    padding: calc(clamp(10px, 1.8vh, 20px) * var(--bscale)) clamp(16px, 2.5vw, 30px);
  }
  .board-row.first {
    border-color: var(--accent);
    background: #1c1c1c;
  }
  .board-rank {
    font-size: calc(clamp(24px, 4.5vh, 52px) * var(--bscale));
    font-weight: 800;
    color: var(--muted);
    min-width: calc(clamp(44px, 6vw, 84px) * var(--bscale));
    text-align: center;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .board-row.first .board-rank { color: var(--accent); }
  .board-name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: calc(clamp(24px, 5vh, 58px) * var(--bscale));
    font-weight: 700;
    line-height: 1.15;
    word-break: break-word;
  }
  .board-score {
    font-size: calc(clamp(28px, 5.5vh, 64px) * var(--bscale));
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
    letter-spacing: -1px;
  }
  .board-empty {
    color: var(--muted);
    font-size: 20px;
    text-align: center;
    font-style: italic;
    padding: 40px;
  }
  body.board-mode .sidebar { display: none; }
  body.board-mode .layout { grid-template-columns: 1fr; }
  [hidden] { display: none !important; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; overflow-y: auto; height: auto; }
    .stage { height: 70vh; }
    .sidebar { height: auto; border-left: none; border-top: 1px solid var(--line); }
    .team-list { max-height: none; }
    .history-drawer { right: 0; width: 100vw; }
    #saveIndicator { right: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    svg#wheel { transition: transform 1s ease-out; }
  }

  /* Save indicator — bottom corner, just left of the sidebar, so it never covers controls */
  #saveIndicator {
    position: fixed; bottom: 14px; right: 438px; z-index: 50;
    background: var(--panel-2); color: var(--accent); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    opacity: 0; transition: opacity .2s ease; pointer-events: none;
  }
  #saveIndicator.show { opacity: 1; }

  /* New night button — slightly warned styling */
  #newNightBtn:hover { border-color: #d9736f; color: #d9736f; }

  /* Leaderboard link */
  .leaderboard-link { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.5; word-break: break-all; }
  .leaderboard-link b { color: var(--accent); }

  /* Audit / score history — a drawer beside the sidebar, so it never steals
     room from the team list */
  .history-drawer {
    position: fixed; top: 0; bottom: 0; right: 420px; z-index: 45;
    width: min(380px, calc(100vw - 440px));
    background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    box-shadow: -18px 0 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
    padding: 14px 14px 12px;
  }
  .audit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
  .audit-head > span { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .audit-head-btns { display: flex; gap: 6px; }
  .audit-clear { background: transparent; border: 1px solid var(--line); color: var(--muted); font-size: 11px; padding: 4px 9px; border-radius: 6px; cursor: pointer; }
  .audit-clear:hover { border-color: #d9736f; color: #d9736f; }
  #closeHistory:hover { border-color: var(--accent); color: var(--accent); }
  #auditList { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .audit-empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 0; }
  .audit-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 8px; background: var(--panel-2); border-radius: 6px; }
  .audit-time { color: var(--muted); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .audit-team { flex: 1 1 auto; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .audit-change { flex: 0 0 auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .audit-change.pos { color: var(--green-soft, #6ee08a); }
  .audit-change.neg { color: #d9736f; }
  .audit-tot { flex: 0 0 auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .audit-kind { flex: 0 0 auto; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
  .audit-undo { flex: 0 0 auto; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 10px; padding: 2px 7px; border-radius: 5px; cursor: pointer; }

  /* ---- Music round ---- */
  .music-stage {
    justify-content: flex-start; align-items: stretch;
    padding: 12px 24px 20px;
    overflow-y: auto;
    gap: 12px;
  }
  .music-head { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  /* left column starts below the fixed view buttons; the player sits beside them */
  .music-info { display: flex; flex-direction: column; gap: 9px; min-width: 260px; flex: 1 1 300px; margin-top: 54px; }
  .music-legend { font-size: 12.5px; color: var(--muted); }
  .music-title { margin: 0; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; font-weight: 800; }
  .music-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .music-ctl label { display: flex; align-items: center; gap: 6px; }
  .music-ctl input {
    width: 62px; background: #000; border: 1px solid var(--line); color: var(--ink);
    padding: 6px 8px; border-radius: 7px; font-size: 14px; text-align: right; font-weight: 700;
  }
  .music-ctl input:focus { outline: none; border-color: var(--accent); }
  .mbtn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .mbtn:hover { border-color: var(--accent); }
  .mbtn.on { border-color: var(--accent); color: var(--accent); }
  .mbtn.warn:hover { border-color: #d9736f; color: #d9736f; }
  .mbtn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 800; }
  .mbtn.primary:hover { filter: brightness(.92); }
  .mbtn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
  .now-playing {
    font-size: 15px; color: var(--muted); min-height: 22px;
  }
  .now-playing b { color: var(--accent); }
  .now-playing .err { color: #f0a08f; }
  .yt-box {
    width: 260px; height: 200px; flex: 0 0 auto;  /* YouTube's minimum player size is 200x200 */
    background: #000; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; text-align: center;
  }
  .yt-box iframe { width: 100%; height: 100%; border: 0; display: block; }

  .music-table-wrap { overflow-x: auto; }
  table.music { border-collapse: separate; border-spacing: 0; width: 100%; }
  table.music th, table.music td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.music thead th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    font-weight: 700; text-align: left; position: sticky; top: 0; background: var(--bg);
  }
  table.music th.team-col {
    text-align: center; min-width: 84px; max-width: 120px;
    border-top: 4px solid var(--line);
    color: var(--ink); font-size: 12.5px; letter-spacing: .3px; text-transform: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 5px 3px;
  }
  .team-col .tname { display: block; overflow: hidden; text-overflow: ellipsis; }
  .team-col .tpts { display: block; font-size: 15px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .song-num { width: 28px; text-align: center; color: var(--muted); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
  .play-cell { width: 68px; }
  .play-btn {
    width: 60px; height: 36px; border-radius: 10px;
    background: var(--accent); color: #000; border: none; cursor: pointer;
    font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .play-btn:hover { filter: brightness(.92); }
  .play-btn.playing { background: #f5c518; }
  .play-btn:disabled { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
  .answer { min-width: 150px; }
  .answer .t { font-size: 16px; font-weight: 800; line-height: 1.2; }
  .answer .ay { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .answer .ay b { color: var(--ink); font-weight: 700; }
  .answer .warn { font-size: 11.5px; color: #f0a08f; margin-top: 3px; }
  tr.is-playing td { background: rgba(69,219,224,.07); }
  td.marks { text-align: center; white-space: nowrap; padding: 6px 3px; }
  .mk {
    width: 25px; height: 30px; margin: 0; border-radius: 7px;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    font-size: 12px; font-weight: 800; cursor: pointer; padding: 0;
  }
  .mk:hover { border-color: var(--accent); color: var(--ink); }
  .mk + .mk { margin-left: 2px; }
  .mk.on { background: #3cb44b; border-color: #3cb44b; color: #000; }
  table.music tfoot td { border-bottom: none; }
  .tot-label { text-align: right; }
  .add-cell { text-align: center; padding: 8px 3px !important; }
  .add-team-btn {
    min-width: 76px; padding: 7px 6px; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #000; border: 1px solid var(--accent);
    font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .add-team-btn:hover { filter: brightness(.92); }
  .add-team-btn.done { background: transparent; color: #6ee08a; border-color: var(--line); cursor: default; font-weight: 700; filter: none; }
  .add-team-btn.neg { background: transparent; color: #d9736f; border-color: #b5484e; }
  .add-none { color: var(--muted); }
  .music-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .music-foot .note { font-size: 12.5px; color: var(--muted); }
  .music-empty { color: var(--muted); font-style: italic; padding: 18px 6px; }

  /* edit-songs mode */
  table.music.editing td { padding: 5px 4px; }
  .edit-in {
    width: 100%; background: #000; border: 1px solid var(--line); color: var(--ink);
    padding: 7px 8px; border-radius: 7px; font-size: 13.5px; font-family: inherit;
  }
  .edit-in:focus { outline: none; border-color: var(--accent); }
  .edit-in.bad { border-color: #b5484e; }
  .edit-in.small { width: 74px; text-align: center; }
  .edit-in.year { width: 70px; text-align: center; }
  .yt-state { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .yt-state.ok { color: #6ee08a; }
  .yt-state.bad { color: #f0a08f; }
  .rm-song { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 7px; width: 30px; height: 32px; cursor: pointer; }
  .rm-song:hover { border-color: #b5484e; color: #d9736f; }
</style>
</head>
<body>
<div id="viewSwitch" role="group" aria-label="What this screen shows">
  <button data-view="wheel" class="on">Wheel</button>
  <button data-view="board">Leaderboard</button>
  <button data-view="music">Music</button>
</div>
<button id="tvToggle" title="Control what the separate TV screen shows">TV shows: Leaderboard</button>
<div id="saveIndicator">Saved &#10003;</div>

<div class="layout">

  <div class="stage" id="wheelStage">
    <div class="wheel-holder">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="0 0 400 400" role="img" aria-label="Team spinner wheel"></svg>
      <div class="hub"></div>
    </div>
    <button id="spinBtn">Spin</button>
    <div class="result" id="result"></div>
  </div>

  <div class="stage board-stage" id="boardStage" hidden>
    <h1 class="board-title">Standings</h1>
    <div class="board" id="board"></div>
  </div>

  <div class="stage music-stage" id="musicStage" hidden>
    <div class="music-head">
      <div class="music-info">
        <h1 class="music-title">Music Round</h1>
        <div class="music-ctl">
          <label title="How many seconds each clip plays">Clip <input type="number" id="clipLen" min="5" max="120"> sec</label>
          <label title="Points for each correct title, artist or year">Each correct <input type="number" id="ptsEach" min="1" step="50"> pts</label>
          <button class="mbtn" id="editSongsBtn">Edit songs</button>
          <button class="mbtn warn" id="newRoundBtn" title="Clear the checkmarks to run another music round">New round</button>
        </div>
        <div class="music-legend" id="musicLegend"></div>
        <div class="now-playing" id="nowPlaying"></div>
      </div>
      <div class="yt-box" id="ytBox"><div id="ytPlayer">YouTube player loads here</div></div>
    </div>
    <div class="music-table-wrap"><table class="music" id="musicTable"></table></div>
    <div class="music-foot" id="musicFoot"></div>
  </div>

  <aside class="sidebar">
    <div class="side-head">
      <div class="side-title">
        <h2>Teams &amp; Scores</h2>
        <button id="historyBtn" title="Show the score history log">History</button>
      </div>
      <p class="sub">TV screen: <b id="boardUrl">&mdash;</b></p>
    </div>
    <div class="toolbar">
      <button id="sortBtn" class="primary">Sort by points &#8595;</button>
      <button id="restoreBtn">Restore wheel</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="resetScoresBtn">Reset scores</button>
      <button id="newNightBtn">New night (clear teams)</button>
    </div>
    <div class="team-list" id="teamList"></div>
    <div class="side-foot">
      <button class="add-btn" id="addBtn">+ Add team</button>
    </div>
  </aside>

</div>

<aside class="history-drawer" id="historyDrawer" hidden>
  <div class="audit-head">
    <span>Score history</span>
    <div class="audit-head-btns">
      <button id="clearAudit" class="audit-clear">Clear log</button>
      <button id="closeHistory" class="audit-clear">Close</button>
    </div>
  </div>
  <div id="auditList"><div class="audit-empty">No score changes yet.</div></div>
</aside>

<script>
// Distinct default colors, one per team
const TEAM_COLORS = [
  "#e6194b","#3cb44b","#4363d8","#f58231","#911eb4",
  "#42d4f4","#f032e6","#bfef45","#fabed4","#469990",
  "#dcbeff","#9a6324","#fffac8","#800000","#aaffc3",
  "#808000","#ffd8b1","#000075","#a9a9a9","#ffe119"
];

let teams = [
  { id: "t_1", name: "Team 1", score: 0, color: TEAM_COLORS[0], out: false, bid: 0 },
  { id: "t_2", name: "Team 2", score: 0, color: TEAM_COLORS[1], out: false, bid: 0 },
  { id: "t_3", name: "Team 3", score: 0, color: TEAM_COLORS[2], out: false, bid: 0 },
  { id: "t_4", name: "Team 4", score: 0, color: TEAM_COLORS[3], out: false, bid: 0 },
];
let rotation = 0;
let spinning = false;
let colorCursor = teams.length;

/* ---------- Persistence (Netlify Blobs backend) ---------- */
const SCORES_API = "/.netlify/functions/scores";
let saveTimer = null;
let lastSavedJSON = "";

function newTeamId(){ return "t_" + Math.random().toString(36).slice(2, 9); }

/* ---------- Audit log ---------- */
let auditLog = [];   // [{ time, teamId, teamName, change, before, after, kind }]
function logAudit(team, change, before, after, kind){
  auditLog.unshift({
    time: Date.now(),
    teamId: team.id,
    teamName: team.name || "Team",
    change: change,
    before: before,
    after: after,
    kind: kind || "adjust"
  });
  if (auditLog.length > 200) auditLog.length = 200; // cap
  renderAudit();
  saveState();
}
function fmtTime(ts){
  const d = new Date(ts);
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")} ${ampm}`;
}
function renderAudit(){
  const box = document.getElementById("auditList");
  const hb = document.getElementById("historyBtn");
  if (hb) hb.textContent = auditLog.length ? `History (${auditLog.length})` : "History";
  if (!box) return;
  if (!auditLog.length) { box.innerHTML = `<div class="audit-empty">No score changes yet.</div>`; return; }
  box.innerHTML = auditLog.map((e, idx) => `
    <div class="audit-row">
      <span class="audit-time">${fmtTime(e.time)}</span>
      <span class="audit-team">${escapeHtml(e.teamName)}</span>
      <span class="audit-change ${e.change.startsWith("\u2212")?"neg":"pos"}">${escapeHtml(e.change)}</span>
      <span class="audit-tot">${e.before.toLocaleString()} \u2192 ${e.after.toLocaleString()}</span>
      <span class="audit-kind">${escapeHtml(e.kind)}</span>
      ${idx===0 ? `<button class="audit-undo" onclick="undoLast()">undo</button>` : ""}
    </div>`).join("");
}
window.undoLast = function(){
  const last = auditLog[0];
  if (!last) return;
  const team = teams.find(t => t.id === last.teamId);
  if (!team) { toast && toast("That team is gone"); auditLog.shift(); renderAudit(); return; }
  team.score = last.before;           // revert to the pre-change value
  // Undoing a music-round add puts those points back to "not added yet"
  if (last.kind === "music" && music.applied[team.id] != null) {
    music.applied[team.id] -= (last.after - last.before);
    if (!music.applied[team.id]) delete music.applied[team.id];
    if (musicMode) renderMusic();
  }
  auditLog.shift();                    // remove the entry
  renderAudit();
  syncScores();
};
function toast(m){ /* lightweight — reuse save indicator area */ const el=document.getElementById("saveIndicator"); if(el){ el.textContent=m; el.classList.add("show"); setTimeout(()=>{el.classList.remove("show"); el.textContent="Saved \u2713";},1400);} }


// Ensure every team has a stable id (older saved data or new rows).
function ensureIds(){ teams.forEach(t => { if (!t.id) t.id = newTeamId(); }); }

// Debounced save — rapid +/- clicks collapse into one write.
function saveState(){
  ensureIds();
  const payload = snapshotJSON();
  if (payload === lastSavedJSON) return;         // nothing actually changed
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const snap = JSON.parse(payload);
      const res = await fetch(SCORES_API + "?action=save", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ teams: snap.teams, audit: snap.audit, music: snap.music })
      });
      if (!res.ok) throw new Error("save failed");
      lastSavedJSON = payload;
      flashSaved();
    } catch(e) { /* offline / hiccup — next change retries */ }
  }, 500);
}

async function loadState(){
  try {
    const res = await fetch(SCORES_API + "?action=status", { cache: "no-store" });
    const data = await res.json();
    if (data.teams && data.teams.length) {
      teams = data.teams.map(t => ({
        id: t.id || newTeamId(),
        name: t.name || "", score: Number(t.score)||0,
        color: t.color || TEAM_COLORS[0], out: !!t.out, bid: Number(t.bid)||0
      }));
      colorCursor = teams.length;
    }
    if (Array.isArray(data.audit)) { auditLog = data.audit; renderAudit(); }
    if (data.music && Array.isArray(data.music.songs)) music = normalizeMusic(data.music);
    if (data.display === "wheel" || data.display === "song") tvDisplay = data.display;
    if (data.song && data.song.n) tvSong = data.song.n;
    updateTVLabel();
    lastSavedJSON = snapshotJSON();
  } catch(e) { /* no saved state yet, or offline — keep the defaults */ }
}

// Everything the backend keeps, as one string — used to skip no-op saves.
function snapshotJSON(){
  return JSON.stringify({
    teams: teams.map(t => ({ id: t.id, name: t.name, score: t.score, color: t.color, out: !!t.out, bid: t.bid || 0 })),
    audit: auditLog,
    music: { clip: music.clip, points: music.points, songs: music.songs, marks: music.marks, applied: music.applied }
  });
}

function flashSaved(){
  const el = document.getElementById("saveIndicator");
  if (!el) return;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 900);
}

const wheel = document.getElementById("wheel");
const teamList = document.getElementById("teamList");
const result = document.getElementById("result");
const spinBtn = document.getElementById("spinBtn");

const R = 200, CX = 200, CY = 200;
function polar(cx, cy, r, angle) {
  const a = (angle - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

// Teams shown on the wheel (respecting "out")
function wheelTeams() {
  return teams.filter(t => !t.out);
}

function drawWheel() {
  const active = wheelTeams();
  const n = active.length;
  wheel.innerHTML = "";

  if (n === 0) {
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",CX); c.setAttribute("cy",CY); c.setAttribute("r",R);
    c.setAttribute("fill","#1f1f1f");
    wheel.appendChild(c);
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",CX); t.setAttribute("y",CY); t.setAttribute("fill","#8a8a8a");
    t.setAttribute("text-anchor","middle"); t.setAttribute("font-size","16");
    t.textContent = "Add a team";
    wheel.appendChild(t);
    return;
  }
  if (n === 1) {
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",CX); c.setAttribute("cy",CY); c.setAttribute("r",R);
    c.setAttribute("fill",active[0].color);
    c.setAttribute("stroke","#000"); c.setAttribute("stroke-width","1.5");
    wheel.appendChild(c);
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",CX); t.setAttribute("y",CY); t.setAttribute("fill",pickTextColor(active[0].color));
    t.setAttribute("text-anchor","middle"); t.setAttribute("dominant-baseline","middle");
    t.setAttribute("font-size","16"); t.setAttribute("font-weight","700");
    t.textContent = active[0].name;
    wheel.appendChild(t);
    return;
  }

  const arc = 360 / n;
  active.forEach((team, i) => {
    const start = i * arc;
    const end = start + arc;
    const [x1,y1] = polar(CX,CY,R,start);
    const [x2,y2] = polar(CX,CY,R,end);
    const large = arc > 180 ? 1 : 0;
    const mid = start + arc/2;

    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",`M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z`);
    path.setAttribute("fill",team.color);
    path.setAttribute("stroke","#000");
    path.setAttribute("stroke-width","1.5");
    wheel.appendChild(path);

    if (team.name) {
      const [tx,ty] = polar(CX,CY, R*0.64, mid);
      const text = document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x",tx); text.setAttribute("y",ty);
      text.setAttribute("fill", pickTextColor(team.color));
      text.setAttribute("text-anchor","middle");
      text.setAttribute("dominant-baseline","middle");
      text.setAttribute("font-size", n > 12 ? "11" : "14");
      text.setAttribute("font-weight","700");
      text.setAttribute("transform",`rotate(${mid} ${tx} ${ty})`);
      let lbl = team.name;
      if (lbl.length > 16) lbl = lbl.slice(0,15) + "\u2026";
      text.textContent = lbl;
      wheel.appendChild(text);
    }
  });
}

function pickTextColor(hex) {
  const c = hex.replace("#","");
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return (r*0.299 + g*0.587 + b*0.114) > 150 ? "#000" : "#fff";
}

function renderList() {
  teamList.innerHTML = "";
  const maxScore = Math.max(...teams.map(t => t.score), 0);
  teams.forEach((team, i) => {
    const row = document.createElement("div");
    row.className = "team-row" + (team.score === maxScore && maxScore > 0 ? " leader" : "");

    const rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = (i+1);

    const swatch = document.createElement("input");
    swatch.type = "color";
    swatch.className = "swatch";
    swatch.value = team.color;
    swatch.title = "Team color";
    swatch.oninput = e => { team.color = e.target.value; drawWheel(); if (boardMode) renderBoard(); if (musicMode) renderMusic(); saveState(); };

    const name = document.createElement("textarea");
    name.className = "name-input";
    name.rows = 1;
    name.value = team.name;
    name.placeholder = "Team name\u2026";
    const autoGrow = () => { name.style.height = "auto"; name.style.height = name.scrollHeight + "px"; };
    name.oninput = e => { team.name = e.target.value; autoGrow(); drawWheel(); if (boardMode) renderBoard(); if (musicMode) renderMusic(); saveState(); };
    name.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); name.blur(); } };
    // Grow to fit once the row is in the DOM
    requestAnimationFrame(autoGrow);

    const scoreBox = document.createElement("div");
    scoreBox.className = "score-box";

    // Amount to add/subtract for this team
    const amt = document.createElement("input");
    amt.type = "number";
    amt.className = "amt-input";
    amt.placeholder = "100";
    amt.title = "Points to add or subtract (defaults to 100)";

    const applyDelta = (sign) => {
      const raw = amt.value.trim();
      // Empty box defaults to 100; otherwise use the typed amount
      const v = raw === "" ? 100 : parseInt(raw, 10);
      if (isNaN(v) || v === 0) { amt.focus(); return; }
      const before = team.score;
      team.score += sign * v;
      logAudit(team, (sign>0?"+":"\u2212") + Math.abs(v), before, team.score, "adjust");
      amt.value = "";
      syncScores();
      amt.focus();
    };

    const minus = document.createElement("button");
    minus.className = "op-btn minus"; minus.textContent = "\u2212"; minus.title = "Subtract";
    minus.onclick = () => applyDelta(-1);

    const plus = document.createElement("button");
    plus.className = "op-btn plus"; plus.textContent = "+"; plus.title = "Add";
    plus.onclick = () => applyDelta(1);

    // Enter = add, Shift+Enter = subtract
    amt.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); applyDelta(e.shiftKey ? -1 : 1); }
    };

    // Current running total — a DISPLAY, not an editable field, so it can't be
    // confused with the amount box. Click "Edit" to deliberately correct it.
    const score = document.createElement("div");
    score.className = "total-display";
    score.textContent = team.score.toLocaleString();
    score.title = "Current total";

    const editTotal = document.createElement("button");
    editTotal.className = "edit-total-btn";
    editTotal.textContent = "Edit";
    editTotal.title = "Manually correct this total";
    editTotal.onclick = () => {
      const current = team.score;
      const entered = prompt(`Set ${team.name || "team"}'s total to:`, current);
      if (entered === null) return;
      const v = parseInt(entered, 10);
      if (isNaN(v)) return;
      team.score = v;
      logAudit(team, "set", current, v, "manual");
      syncScores();
    };

    scoreBox.append(amt, minus, plus);

    /* ---- Gamble / wager row ---- */
    const betBox = document.createElement("div");
    betBox.className = "bet-box";

    const betLabel = document.createElement("span");
    betLabel.className = "bet-label";
    betLabel.textContent = "Bid";

    const bet = document.createElement("input");
    bet.type = "number";
    bet.className = "bet-input";
    bet.placeholder = "0";
    bet.title = "Wager amount";
    if (team.bid) bet.value = team.bid;
    bet.oninput = e => { team.bid = parseInt(e.target.value || "0", 10) || 0; };

    const allIn = document.createElement("button");
    allIn.className = "bet-btn allin";
    allIn.textContent = "All in";
    allIn.title = "Bid this team's entire score";
    allIn.onclick = () => {
      bet.value = team.score;
      team.bid = team.score;
      bet.focus();
    };

    const won = document.createElement("button");
    won.className = "bet-btn won";
    won.textContent = "Won";
    won.title = "Team won the wager \u2014 add the bid";
    won.onclick = () => resolveBet(1);

    const lost = document.createElement("button");
    lost.className = "bet-btn lost";
    lost.textContent = "Lost";
    lost.title = "Team lost the wager \u2014 subtract the bid";
    lost.onclick = () => resolveBet(-1);

    const resolveBet = (sign) => {
      const v = parseInt(bet.value || "0", 10);
      if (isNaN(v) || v === 0) { bet.focus(); return; }
      const before = team.score;
      team.score += sign * v;
      logAudit(team, (sign>0?"+":"\u2212") + Math.abs(v), before, team.score, sign>0?"bid won":"bid lost");
      bet.value = "";
      team.bid = 0;
      syncScores();
    };

    bet.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); resolveBet(e.shiftKey ? -1 : 1); }
    };

    betBox.append(betLabel, bet, allIn, won, lost);

    const del = document.createElement("button");
    del.className = "del-btn";
    del.textContent = "\u2715";
    del.title = "Delete team";
    del.onclick = () => {
      teams.splice(i,1);
      forgetMusicTeam(team.id);
      renderList(); drawWheel(); saveState();
    };

    // Line 1: who + running total.  Line 2: points and bid controls.
    const top = document.createElement("div");
    top.className = "row-top";
    top.append(rank, swatch, name, score, editTotal, del);

    const bottom = document.createElement("div");
    bottom.className = "row-bottom";
    bottom.append(scoreBox, betBox);

    row.append(top, bottom);
    teamList.appendChild(row);
  });
  if (typeof boardMode !== "undefined" && boardMode) renderBoard();
  if (typeof musicMode !== "undefined" && musicMode) renderMusic();
  fitTeams();
  requestAnimationFrame(fitTeams);   // again once long names have wrapped
}

// Keep every team on screen: if the roster overflows the panel, switch the
// rows to a tighter layout. (Re-checked whenever the list or window changes.)
function fitTeams() {
  const regrow = () => teamList.querySelectorAll(".name-input").forEach(n => {
    n.style.height = "auto"; n.style.height = n.scrollHeight + "px";
  });
  teamList.classList.remove("dense"); regrow();
  if (teamList.scrollHeight > teamList.clientHeight + 1) { teamList.classList.add("dense"); regrow(); }
}
window.addEventListener("resize", fitTeams);

// Re-render scores in the list without rebuilding (keeps focus stable on step clicks)
function syncScores() {
  const rows = teamList.querySelectorAll(".team-row");
  rows.forEach((row, i) => {
    const disp = row.querySelector(".total-display");
    if (disp && teams[i]) disp.textContent = teams[i].score.toLocaleString();
  });
  markLeaders();
  saveState();
}

function markLeaders() {
  const maxScore = Math.max(...teams.map(t => t.score), 0);
  const rows = teamList.querySelectorAll(".team-row");
  rows.forEach((row, i) => {
    row.classList.toggle("leader", teams[i].score === maxScore && maxScore > 0);
  });
  if (typeof boardMode !== "undefined" && boardMode) renderBoard();
}

function nextColor() {
  const c = TEAM_COLORS[colorCursor % TEAM_COLORS.length];
  colorCursor++;
  return c;
}

document.getElementById("addBtn").onclick = () => {

document.getElementById("sortBtn").onclick = () => {

document.getElementById("shuffleBtn").onclick = () => {

// Enable Restore only when at least one team is off the wheel
function updateRestoreBtn() {

/* ---------- Leaderboard mode ---------- */
let boardMode = false;
let musicMode = false;
let editingSongs = false;
const wheelStage = document.getElementById("wheelStage");
const boardStage = document.getElementById("boardStage");
const board = document.getElementById("board");
const musicStage = document.getElementById("musicStage");
const viewSwitch = document.getElementById("viewSwitch");

function renderBoard() {
  board.innerHTML = "";
  if (teams.length === 0) {
    board.innerHTML = '<div class="board-empty">No teams yet.</div>';
    return;
  }
  // Shrink rows as the roster grows so everything stays on one screen
  const n = teams.length;
  const scale = n <= 6 ? 1 : n <= 10 ? 0.75 : n <= 16 ? 0.55 : 0.42;
  board.style.setProperty("--bscale", scale);

  // Sort a copy so the roster order on the right is untouched
  const ranked = teams.slice().sort((a,b) => b.score - a.score);
  let lastScore = null, lastRank = 0;
  ranked.forEach((team, i) => {
    // Ties share a rank
    const rank = (team.score === lastScore) ? lastRank : i + 1;
    lastScore = team.score; lastRank = rank;

    const row = document.createElement("div");
    row.className = "board-row" + (rank === 1 ? " first" : "");
    row.style.borderLeftColor = team.color;

    const rk = document.createElement("div");
    rk.className = "board-rank";
    rk.textContent = rank;

    const nm = document.createElement("div");
    nm.className = "board-name";
    nm.textContent = team.name || "\u2014";

    const sc = document.createElement("div");
    sc.className = "board-score";
    sc.textContent = team.score.toLocaleString();

    row.append(rk, nm, sc);
    board.appendChild(row);
  });
}

// Local view switch: what THIS screen shows (no backend). The TV is separate.
function setView(view) {

}
viewSwitch.querySelectorAll("button").forEach(b => b.onclick = () => setView(b.dataset.view));

// Control what the TV (scores-board.html) displays: leaderboard or wheel.
// "song" = the TV's big "Song N" card for the music round (set automatically by ▶).
let tvDisplay = "leaderboard";
let tvSong = 0;
function updateTVLabel(){
  const btn = document.getElementById("tvToggle");
  if (!btn) return;
  btn.textContent = "TV shows: " + (tvDisplay === "wheel" ? "Wheel" : tvDisplay === "song" ? "Song " + tvSong : "Leaderboard");
  btn.title = tvDisplay === "leaderboard" ? "Switch the TV to the wheel" : "Switch the TV back to the leaderboard";
}
async function setTVDisplay(mode, songNum){
  tvDisplay = mode;
  if (mode === "song") tvSong = songNum;
  updateTVLabel();
  try {
    await fetch(SCORES_API + "?action=display", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ display: mode, song: songNum, total: music.songs.length })
    });
  } catch(e) {}
}

function spin() {
  const active = wheelTeams();
  if (spinning || active.length === 0) return;
  if (active.length === 1) {
    showResult(active[0]);
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  result.innerHTML = "";

  const n = active.length;
  const arc = 360 / n;
  const winnerIdx = Math.floor(Math.random() * n);
  const winner = active[winnerIdx];
  const winnerCenter = winnerIdx * arc + arc/2;
  const turns = 5 + Math.floor(Math.random()*3);
  const target = turns*360 + (360 - winnerCenter);
  rotation = target;
  wheel.style.transform = `rotate(${rotation}deg)`;

  // Tell the TV to run the same spin (it animates locally to the same winner).
  ensureIds();
  tvDisplay = "wheel"; updateTVLabel();   // spinning puts the wheel on the TV
  try {
    fetch(SCORES_API + "?action=spin", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ winnerId: winner.id, order: active.map(t => t.id), turns })
    });
  } catch(e) {}

  const done = () => {
    wheel.removeEventListener("transitionend", done);
    showResult(winner);
    spinning = false;
    spinBtn.disabled = false;
  };
  wheel.addEventListener("transitionend", done);
}

// Show the picked team plus a manual "remove" button
function showResult(team) {
  result.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "result-inner";

  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = "Picked";

  const val = document.createElement("span");
  val.className = "val"; val.textContent = team.name || "Team";

  const remove = document.createElement("button");
  remove.className = "remove-btn";
  remove.textContent = "Remove from wheel";
  remove.onclick = () => {
    team.out = true;
    rotation = rotation % 360;
    wheel.style.transition = "none";
    wheel.style.transform = `rotate(${rotation}deg)`;
    requestAnimationFrame(()=>{ wheel.style.transition = ""; });
    drawWheel();
    result.innerHTML = "";
    updateRestoreBtn();
    saveState();
  };

  wrap.append(lbl, val, remove);
  result.appendChild(wrap);
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function escAttr(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* =====================================================================
   MUSIC ROUND
   One view: answer key + play button per song, and a T / A / Y checkbox
   per team per song. Each check is worth `music.points` (default 100), so
   a song is worth 300. "Add" pushes only what hasn't been added yet, so
   fixing a checkmark later adds (or removes) just the difference.
   ===================================================================== */
const musicTable = document.getElementById("musicTable");
const musicFoot = document.getElementById("musicFoot");
const nowPlaying = document.getElementById("nowPlaying");
const clipLenIn = document.getElementById("clipLen");
const ptsEachIn = document.getElementById("ptsEach");
const editSongsBtn = document.getElementById("editSongsBtn");
const FIELDS = ["Title", "Artist", "Year"];

function newSongId(){ return "s_" + Math.random().toString(36).slice(2, 9); }
function blankSong(){ return { id: newSongId(), yt: "", start: 0, title: "", artist: "", year: "" }; }
function defaultMusic(){ return { clip: 30, points: 100, songs: Array.from({ length: 6 }, blankSong), marks: {}, applied: {} }; }
let music = defaultMusic();

function normalizeMusic(m){
  const songs = (Array.isArray(m.songs) ? m.songs : []).map(s => ({
    id: s.id || newSongId(), yt: s.yt || "", start: Number(s.start) || 0,
    title: s.title || "", artist: s.artist || "", year: s.year || ""
  }));
  return {
    clip: Number(m.clip) || 30,
    points: Number(m.points) || 100,
    songs: songs.length ? songs : defaultMusic().songs,
    marks: (m.marks && typeof m.marks === "object") ? m.marks : {},
    applied: (m.applied && typeof m.applied === "object") ? m.applied : {}
  };
}
function forgetMusicTeam(id){ delete music.marks[id]; delete music.applied[id]; }

/* --- YouTube links + times --- */
function parseTime(v){
  const s = String(v == null ? "" : v).trim().toLowerCase();
  if (!s) return 0;
  if (/^\d+(\.\d+)?s?$/.test(s)) return Math.round(parseFloat(s));
  if (/^\d+(:\d{1,2}){1,2}$/.test(s)) return s.split(":").reduce((a, p) => a * 60 + parseInt(p, 10), 0);
  const m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  if (m && (m[1] || m[2] || m[3])) return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
  return NaN;
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}
// Accepts youtube.com/watch?v=, youtu.be/, /shorts/, /embed/, music.youtube.com, or a bare video ID.
function parseYouTube(raw){
  const s = String(raw || "").trim();
  if (!s) return null;
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return { id: s, t: 0 };
  let u;
  try { u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s); } catch(e) { return null; }
  const host = u.hostname.replace(/^(www|m)\./, "");
  let id = null;
  if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
  else if (/(^|\.)youtube(-nocookie)?\.com$/.test(host)) {
    id = u.searchParams.get("v");
    if (!id) { const m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([A-Za-z0-9_-]{11})/); if (m) id = m[1]; }
  }
  if (!id || !/^[A-Za-z0-9_-]{11}$/.test(id)) return null;
  const t = parseTime(u.searchParams.get("t") || u.searchParams.get("start") || "");
  return { id, t: isNaN(t) ? 0 : t };
}

/* --- Scoring math --- */
function teamMusicTotal(tid){
  const row = music.marks[tid] || {};
  let checks = 0;
  music.songs.forEach(s => { const b = row[s.id]; if (b) checks += b.filter(Boolean).length; });
  return checks * music.points;
}
function pendingFor(tid){ return teamMusicTotal(tid) - (music.applied[tid] || 0); }

function toggleMark(tid, sid, k){
  const row = music.marks[tid] || (music.marks[tid] = {});
  const b = (row[sid] || [0, 0, 0]).slice();
  b[k] = b[k] ? 0 : 1;
  if (b.some(Boolean)) row[sid] = b; else delete row[sid];
  if (!Object.keys(row).length) delete music.marks[tid];
  renderMusic(); saveState();
}
function addMusicPoints(team){
  const delta = pendingFor(team.id);
  if (!delta) return;
  const before = team.score;
  team.score += delta;
  music.applied[team.id] = (music.applied[team.id] || 0) + delta;
  if (!music.applied[team.id]) delete music.applied[team.id];
  logAudit(team, (delta > 0 ? "+" : "−") + Math.abs(delta), before, team.score, "music");
  syncScores();
  renderMusic();
}

/* --- YouTube player --- */
let ytPlayer = null, ytReady = false, ytLoading = false;
let playing = null;          // { songId, start, end, began, askedAt }
let playTimer = null;
const ytErrors = {};         // songId -> problem message (this session only)
const YT_ERRORS = {
  2: "That YouTube link isn't a valid video.",
  5: "YouTube couldn't play this video in the browser.",
  100: "That video was removed or is private.",
  101: "This upload won't play outside YouTube — swap in a different upload.",
  150: "This upload won't play outside YouTube — swap in a different upload."
};

function setNowPlaying(html){ nowPlaying.innerHTML = html; }
function idleMessage(){
  return ytReady
    ? `Press &#9654; to play a ${music.clip}-second clip. Press it again to stop early.`
    : "Loading the YouTube player&hellip;";
}

function loadYouTubeAPI(){
  if (ytReady || ytLoading) return;
  ytLoading = true;
  window.onYouTubeIframeAPIReady = () => {
    ytPlayer = new YT.Player("ytPlayer", {
      width: 260, height: 200,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => { ytReady = true; if (!playing) setNowPlaying(idleMessage()); renderMusic(); },
        onStateChange: onYTState,
        onError: onYTError
      }
    });
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => {
    ytLoading = false; s.remove();
    setNowPlaying(`<span class="err">Couldn't reach YouTube. Check the internet connection, then click Music again.</span>`);
  };
  document.head.appendChild(s);
}

function playSong(song){
  if (playing && playing.songId === song.id) { stopClip(); return; }
  const num = music.songs.indexOf(song) + 1;
  const yt = parseYouTube(song.yt);
  if (!yt) { setNowPlaying(`<span class="err">Song ${num} has no YouTube link yet &mdash; use Edit songs.</span>`); return; }
  if (!ytReady) { loadYouTubeAPI(); setNowPlaying("Still loading the YouTube player&hellip; try again in a second."); return; }
  delete ytErrors[song.id];
  const start = Number(song.start) || 0;
  playing = { songId: song.id, start, end: start + music.clip, began: false, askedAt: Date.now() };
  ytPlayer.loadVideoById({ videoId: yt.id, startSeconds: start, endSeconds: start + music.clip });
  if (tvDisplay !== "song" || tvSong !== num) setTVDisplay("song", num);   // TV shows "Song N"
  clearInterval(playTimer);
  playTimer = setInterval(tickClip, 250);
  renderMusic();
  tickClip();
}

function stopClip(){
  clearInterval(playTimer); playTimer = null;
  if (playing && ytPlayer) { try { ytPlayer.pauseVideo(); } catch(e) {} }
  playing = null;
  setNowPlaying(idleMessage());
  renderMusic();
}

function tickClip(){
  if (!playing) return;
  const num = music.songs.findIndex(s => s.id === playing.songId) + 1;
  let left = music.clip;
  if (playing.began) {
    let t = playing.start;
    try { t = ytPlayer.getCurrentTime() || playing.start; } catch(e) {}
    left = playing.end - Math.max(t, playing.start);
    if (left <= 0.15) { stopClip(); return; }
  }
  const btn = musicTable.querySelector(`[data-play="${playing.songId}"]`);
  if (btn) btn.innerHTML = "&#9632; " + Math.ceil(left);
  if (!playing.began) {
    const waited = (Date.now() - playing.askedAt) / 1000;
    setNowPlaying(waited > 8
      ? `<span class="err">Song ${num} is taking a while to start&hellip; check the player, or press &#9632; and try again.</span>`
      : `Loading song <b>${num}</b>&hellip;`);
  } else {
    setNowPlaying(`Playing song <b>${num}</b> &mdash; <b>${Math.ceil(left)}</b> sec left`);
  }
}

function onYTState(e){
  if (!playing) return;
  if (e.data === YT.PlayerState.PLAYING) { playing.began = true; tickClip(); }
  else if (e.data === YT.PlayerState.ENDED) stopClip();
  else if (e.data === YT.PlayerState.PAUSED && playing.began) {
    // endSeconds pauses the player at the end of the clip
    let t = 0; try { t = ytPlayer.getCurrentTime(); } catch(err) {}
    if (t >= playing.end - 0.6) stopClip();
  }
}

function onYTError(e){
  const msg = YT_ERRORS[e.data] || "YouTube couldn't play this video.";
  const sid = playing && playing.songId;
  if (sid) ytErrors[sid] = msg;
  const num = music.songs.findIndex(s => s.id === sid) + 1;
  clearInterval(playTimer); playTimer = null; playing = null;
  renderMusic();
  setNowPlaying(`<span class="err">Song ${num || "?"}: ${msg}</span>`);
}

/* --- Rendering --- */
function renderMusic(){
  if (document.activeElement !== clipLenIn) clipLenIn.value = music.clip;
  if (document.activeElement !== ptsEachIn) ptsEachIn.value = music.points;
  editSongsBtn.textContent = editingSongs ? "Done editing" : "Edit songs";
  editSongsBtn.classList.toggle("on", editingSongs);
  if (!playing && !nowPlaying.innerHTML.includes("err")) setNowPlaying(idleMessage());
  if (editingSongs) { renderSongEditor(); return; }

  musicTable.className = "music";
  let h = `<thead><tr><th class="song-num">#</th><th>Play</th><th>Answer</th>`;
  teams.forEach(t => {
    h += `<th class="team-col" style="border-top-color:${escAttr(t.color)}" title="${escAttr(t.name)}">
      <span class="tname">${escapeHtml(t.name || "Team")}</span>
      <span class="tpts">${teamMusicTotal(t.id).toLocaleString()}</span></th>`;
  });
  h += `</tr></thead><tbody>`;

  music.songs.forEach((s, i) => {
    const isP = playing && playing.songId === s.id;
    const hasLink = !!parseYouTube(s.yt);
    const warn = ytErrors[s.id] ? `<div class="warn">${escapeHtml(ytErrors[s.id])}</div>`
               : !hasLink ? `<div class="warn">No YouTube link yet</div>` : "";
    h += `<tr class="${isP ? "is-playing" : ""}">
      <td class="song-num">${i + 1}</td>
      <td class="play-cell"><button class="play-btn${isP ? " playing" : ""}" data-play="${s.id}" ${hasLink ? "" : "disabled"}
          title="${isP ? "Stop" : "Play " + music.clip + " seconds from " + fmtClock(s.start)}">${isP ? "&#9632; " + music.clip : "&#9654;"}</button></td>
      <td class="answer">
        <div class="t">${s.title ? escapeHtml(s.title) : `<span style="color:var(--muted)">&mdash;</span>`}</div>
        <div class="ay"><b>${s.artist ? escapeHtml(s.artist) : "&mdash;"}</b> &middot; ${s.year ? escapeHtml(s.year) : "&mdash;"}</div>
        ${warn}
      </td>`;
    teams.forEach(t => {
      const b = (music.marks[t.id] || {})[s.id] || [0, 0, 0];
      h += `<td class="marks">` + ["T", "A", "Y"].map((L, k) =>
        `<button class="mk${b[k] ? " on" : ""}" data-t="${t.id}" data-s="${s.id}" data-k="${k}" title="${FIELDS[k]} correct">${L}</button>`
      ).join("") + `</td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody>`;

  const anyPending = teams.some(t => pendingFor(t.id) !== 0);
  if (teams.length) {
    h += `<tfoot><tr><td colspan="3" class="tot-label">
      <button class="mbtn primary" id="addAllMusic" ${anyPending ? "" : "disabled"}>Add all to scores</button></td>`;
    teams.forEach(t => {
      const p = pendingFor(t.id);
      const added = music.applied[t.id] || 0;
      if (p > 0) h += `<td class="add-cell"><button class="add-team-btn" data-add="${t.id}" title="Add to ${escAttr(t.name)}'s score">Add +${p.toLocaleString()}</button></td>`;
      else if (p < 0) h += `<td class="add-cell"><button class="add-team-btn neg" data-add="${t.id}" title="Take back points that were added before a checkmark was removed">Fix &minus;${Math.abs(p).toLocaleString()}</button></td>`;
      else h += `<td class="add-cell">${added ? `<span class="add-team-btn done">&#10003; added</span>` : `<span class="add-none">&mdash;</span>`}</td>`;
    });
    h += `</tr></tfoot>`;
  }
  musicTable.innerHTML = h;

  document.getElementById("musicLegend").innerHTML = teams.length
    ? `T = title &middot; A = artist &middot; Y = year &mdash; ${music.points.toLocaleString()} each, ${(music.points * 3).toLocaleString()} per song.`
    : `Add teams in the panel on the right to start scoring.`;
  musicFoot.innerHTML = "";
  const addAll = document.getElementById("addAllMusic");
  if (addAll) addAll.onclick = () => teams.forEach(t => addMusicPoints(t));
}

function renderSongEditor(){
  musicTable.className = "music editing";
  let h = `<thead><tr><th class="song-num">#</th><th>YouTube link</th><th>Start at</th><th>Title</th><th>Artist</th><th>Year</th><th></th></tr></thead><tbody>`;
  music.songs.forEach((s, i) => {
    h += `<tr>
      <td class="song-num">${i + 1}</td>
      <td style="min-width:200px"><input class="edit-in" data-f="yt" data-s="${s.id}" value="${escAttr(s.yt)}" placeholder="Paste the YouTube link">
          <div class="yt-state" data-state="${s.id}"></div></td>
      <td><input class="edit-in small" data-f="start" data-s="${s.id}" value="${s.start ? fmtClock(s.start) : ""}" placeholder="0:00" title="Where the clip starts, like 1:05"></td>
      <td><input class="edit-in" data-f="title" data-s="${s.id}" value="${escAttr(s.title)}" placeholder="Title"></td>
      <td><input class="edit-in" data-f="artist" data-s="${s.id}" value="${escAttr(s.artist)}" placeholder="Artist"></td>
      <td><input class="edit-in year" data-f="year" data-s="${s.id}" value="${escAttr(s.year)}" placeholder="Year"></td>
      <td><button class="rm-song" data-rm="${s.id}" title="Remove this song">&#10005;</button></td>
    </tr>`;
  });
  h += `</tbody>`;
  musicTable.innerHTML = h;
  music.songs.forEach(s => showLinkState(s));
  musicFoot.innerHTML = `<button class="mbtn" id="addSongBtn">+ Add song</button>
    <button class="mbtn warn" id="clearSongsBtn">Clear all songs</button>
    <span class="note">Clips play ${music.clip} seconds from the start time. Links with a time in them (like &amp;t=65) fill it in for you.</span>`;
  document.getElementById("addSongBtn").onclick = () => { music.songs.push(blankSong()); renderMusic(); saveState(); };
  document.getElementById("clearSongsBtn").onclick = () => {
    if (!confirm("Clear every song's link and answers? (Checkmarks for this round are cleared too.)")) return;
    if (playing) stopClip();
    music.songs = defaultMusic().songs; music.marks = {};
    renderMusic(); saveState();
  };
}

function showLinkState(s){
  const el = musicTable.querySelector(`[data-state="${s.id}"]`);
  if (!el) return;
  const yt = parseYouTube(s.yt);
  if (!s.yt.trim()) { el.className = "yt-state"; el.textContent = ""; }
  else if (yt) { el.className = "yt-state ok"; el.textContent = "✓ Video found"; }
  else { el.className = "yt-state bad"; el.textContent = "Not a YouTube link I recognize"; }
}

// One click handler for the whole table (play, checkmarks, add, remove song)
musicTable.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.play) { const s = music.songs.find(x => x.id === b.dataset.play); if (s) playSong(s); }
  else if (b.dataset.k != null && b.dataset.t) toggleMark(b.dataset.t, b.dataset.s, +b.dataset.k);
  else if (b.dataset.add) { const t = teams.find(x => x.id === b.dataset.add); if (t) addMusicPoints(t); }
  else if (b.dataset.rm) {
    const s = music.songs.find(x => x.id === b.dataset.rm);
    if (!s) return;
    const label = s.title || ("song " + (music.songs.indexOf(s) + 1));
    if (!confirm(`Remove ${label}? Any checkmarks for it go too.`)) return;
    if (playing && playing.songId === s.id) stopClip();
    music.songs = music.songs.filter(x => x !== s);
    Object.values(music.marks).forEach(row => delete row[s.id]);
    renderMusic(); saveState();
  }
});
// Typing in the song editor updates the song without redrawing (keeps your cursor)
musicTable.addEventListener("input", e => {
  const inp = e.target.closest("input[data-f]");
  if (!inp) return;
  const s = music.songs.find(x => x.id === inp.dataset.s);
  if (!s) return;
  const f = inp.dataset.f;
  if (f === "start") {
    const v = parseTime(inp.value);
    inp.classList.toggle("bad", isNaN(v));
    if (!isNaN(v)) s.start = v;
  } else {
    s[f] = inp.value;
    if (f === "yt") {
      showLinkState(s);
      delete ytErrors[s.id];
      const yt = parseYouTube(s.yt);
      if (yt && yt.t && !s.start) {
        s.start = yt.t;
        const st = musicTable.querySelector(`input[data-f="start"][data-s="${s.id}"]`);
        if (st) { st.value = fmtClock(yt.t); st.classList.remove("bad"); }
      }
    }
  }
  saveState();
});

clipLenIn.onchange = () => {
  const v = Math.round(Number(clipLenIn.value));
  music.clip = Math.max(5, Math.min(120, v || 30));
  renderMusic(); saveState();
};
ptsEachIn.onchange = () => {
  const v = Math.round(Number(ptsEachIn.value));
  music.points = Math.max(1, Math.min(10000, v || 100));
  renderMusic(); saveState();
};
editSongsBtn.onclick = () => { editingSongs = !editingSongs; renderMusic(); };
document.getElementById("newRoundBtn").onclick = () => {
  if (!confirm("Start a new music round? This clears all checkmarks. Points already added to scores stay.")) return;
  if (playing) stopClip();
  music.marks = {}; music.applied = {};
  renderMusic(); saveState();
};

spinBtn.onclick = spin;
wheel.onclick = spin;

// Load any saved state from the backend first, then render.
(async () => {
  const boardUrlEl = document.getElementById("boardUrl");
  if (boardUrlEl) boardUrlEl.textContent = new URL("scores-board.html", location.href).href;
  document.getElementById("tvToggle").onclick = () => setTVDisplay(tvDisplay === "leaderboard" ? "wheel" : "leaderboard");
  const drawer = document.getElementById("historyDrawer");
  const historyBtn = document.getElementById("historyBtn");
  const showHistory = open => { drawer.hidden = !open; historyBtn.classList.toggle("open", open); };
  historyBtn.onclick = () => showHistory(drawer.hidden);
  document.getElementById("closeHistory").onclick = () => showHistory(false);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !drawer.hidden) showHistory(false); });
  document.getElementById("clearAudit").onclick = () => {
    if (!confirm("Clear the score history log? (Team scores are not affected.)")) return;
    auditLog = []; renderAudit(); saveState();
  };
  await loadState();
  renderList();
  drawWheel();
  updateRestoreBtn();
  renderAudit();
})();
</script>
</body>
</html>
